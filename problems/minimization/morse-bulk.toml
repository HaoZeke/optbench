id = "minimization/morse-bulk"
title = "Morse bulk"
suite = "minimization"
problem = "morse-bulk"
contract = "stated"
entry_count = 11

# Every start in website/minimization/morse-bulk/morse-bulk.tgz is a
# 256-atom .con with no frozen atoms. One Hessian is 3N coordinates.
atoms = 256

[convergence]
force_norm = 1.0e-3
force_unit = "eV/Ang"
max_force_calls = 10000

[input]
archive_path = "website/minimization/morse-bulk/morse-bulk.tgz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_min", "nfailed"]

[reference_entry]
path = "archive/entries/minimization/morse-bulk/eon-cg"
potential = "morse_pt"
report_cap = 10000

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
