id = "minimization/morse-bulk"
title = "Morse bulk"
suite = "minimization"
problem = "morse-bulk"
contract = "stated"
entry_count = 11

[convergence]
force_norm = 1.0e-3
force_unit = "eV/Ang"
max_force_calls = 10000

[bound]
kind = "cluster"
scale = 1.0
length = "bond"
bond = 2.897
periodic = true
atoms = 256

[input]
archive_path = "website/minimization/morse-bulk/morse-bulk.tgz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_min", "nfailed"]

[reference_entry]
path = "archive/entries/minimization/morse-bulk/eon-cg"
potential = "morse_pt"
report_cap = 10000

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
success = "harness force calls under the cap, the force norm at the stop, Hessian index 0 on the full Hessian, and one connected cluster. Neighbours lie within the Morse bond length 2.897 under the orthorhombic minimum image. A dissociated cell is divergence. Energy and Kabsch RMSD are not applied: this file has no per-start reference."
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_not_converged",
  "n_crash",
]
