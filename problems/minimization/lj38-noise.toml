id = "minimization/lj38-noise"
title = "Lennard-Jones 38 clusters with Gaussian force noise"
suite = "minimization"
problem = "lj38-noise"
contract = "stated"
remark = "Gaussian force noise on the clean Lennard-Jones energy. The harness campaigns use that rule. The quadratic sample is results/validation/statistics.json."

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0
pair_style = "lj/cut/opt"

[sample]
starts = 1000
geometry = "cluster_%.4i.con"

[input]
archive_path = "website/minimization/lj38/lj38-clusters.tgz"

[convergence]
norm = "l2"
force_norm = 0.01
force_unit = "energy/distance"
energy_tol = 0.01
max_force_calls = 10000

[bound]
kind = "cluster"
scale = 1.5
length = "sigma"
atoms = 38

[noise]
distribution = "gaussian"
component = "force"
energy = "clean"
sigma = [0.0, 1e-4, 1e-3, 1e-2]
kappa = 3.0
window = 5
seed = 20261016
rule = "Stop when the noisy force norm is at most max(clean tolerance, kappa * sigma * sqrt(components)) and, when sigma is positive, the clean energy over the last window evaluations spans at most max(energy_tol, kappa * sigma). The Hessian is the clean force. One force sample inside the floor does not stop the search. Newton and dogleg need that exact Hessian, so they run only at sigma 0."

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_min", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
success = "harness force calls under the cap, the noisy force at the noise-aware stop, and when sigma is positive a clean-energy window whose span is at most max(energy_tol, kappa * sigma). The Hessian is the clean force. The index is vibrational: the six rigid modes are removed, and a curvature is negative only below -max(force_norm, 1e-8*||H||_F, 1e-6), with that force_norm the noise-aware stop. The atoms form one connected cluster with neighbours within 1.5 sigma. A dissociated cluster is divergence. Energy and Kabsch RMSD are not applied: this file has no per-start reference."
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_not_converged",
  "n_crash",
]
