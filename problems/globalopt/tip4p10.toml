id = "globalopt/tip4p10"
title = "tip4p10"
suite = "globalopt"
problem = "tip4p10"
contract = "shared"
entry_count = 2
remark = "Success is an energy at or below the Cambridge Cluster Database TIP4P N=10 minimum plus 0.001. The cap of 1000000 force calls is above the archived GMIN maximum of 148360."

[potential]
kind = "tip4p"
rigid = true

[reference]
energy = -391.0226842125
page = "http://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P-water.html"
points = "https://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P/xyz/TIP4P-10.xyz"

[sample]
starts = 10000

[convergence]
energy_above_minimum = 0.001
max_force_calls = 1000000

[input]
archive_path = "website/globalopt/tip4p10/10000_tip4p10.tar.gz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_not_converged",
  "n_crash",
]
