id = "globalopt/lj150"
title = "lj150"
suite = "globalopt"
problem = "lj150"
contract = "partial"
entry_count = 2
remark = "The known minimum is -893.310258 from the Cambridge LJ table. The same 0.001 window as LJ38 is the hit test. The harness budget is 1000000 force calls. The archived GMIN nosym energy_calls_mean is 6.9596491e5. Geometry files are coords followed by digits."

[sample]
starts = 100
layout = "coords"

[input]
archive_path = "website/globalopt/lj150/lj150_clusters.tgz"

[convergence]
energy_above_minimum = 0.001
energy_minimum = -893.310258
max_force_calls = 1000000

[metrics]
required = ["basin_hopping_steps_mean", "basin_hopping_steps_stddev", "cpu_time_mean", "cpu_time_stddev", "energy_calls_mean", "energy_calls_stddev", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
