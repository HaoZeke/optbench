id = "globalopt/lj98"
title = "lj98"
suite = "globalopt"
problem = "lj98"
contract = "partial"
entry_count = 2
remark = "The 2014 archive states no force-call cap. archive/entries/globalopt/lj98/gmin-nosym/benchmark.dat records energy_calls_mean and energy_calls_stddev, not a force-call cap. The declared cap is 2000000, the cap recorded for ranked rows eon-client-bh-lj38 and eon-svn-bh-lj38 in results/board/problems/globalopt-lj38.json. Success is an energy at or below the Cambridge Cluster Database N=98 minimum plus 0.001."

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0

[reference]
energy = -543.665361
symmetry = "Td"
page = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/tables.150.html"
points = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/points/98"

[sample]
starts = 100

[convergence]
energy_above_minimum = 0.001
max_force_calls = 2000000

[input]
archive_path = "website/globalopt/lj98/lj98_clusters.tgz"

[metrics]
required = ["basin_hopping_steps_mean", "basin_hopping_steps_stddev", "cpu_time_mean", "cpu_time_stddev", "energy_calls_mean", "energy_calls_stddev", "nfailed"]

[scoring.archive]
label = "archive"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the archive table."

[scoring.v2]
version = "par2-rate-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
