id = "globalopt/lj38"
title = "Lennard-Jones 38 global minimum"
suite = "globalopt"
problem = "lj38"
contract = "stated"
entry_count = 5
remark = "The 2014 eOn config at archive/entries/globalopt/lj38/eon-basinhopping/config.ini sets steps to 10000000 and states no force-call cap. benchmark.dat in that directory records an observed force_calls_max of 1795901. The pele benchmark.dat records an observed force_calls_max of 2.5339e+06. Those lines are maxima, not caps. The declared cap is 2000000, the cap recorded for ranked rows eon-client-bh-lj38 and eon-svn-bh-lj38 in results/board/problems/globalopt-lj38.json."

[sample]
starts = 100

[convergence]
energy_above_minimum = 0.001
max_force_calls = 2000000

[reference]
energy = -173.928427
symmetry = "Oh"
page = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/tables.150.html"
points = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/points/38"

[input]
archive_path = "website/globalopt/lj38/100_lj38.tar.gz"

[metrics]
required = ["force_calls", "force_calls_min", "force_calls_max", "nfailed"]

[scoring.archive]
label = "archive"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the archive table."

[scoring.v2]
version = "par2-rate-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
