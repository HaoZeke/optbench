id = "globalopt/lj38"
title = "Lennard-Jones 38 global minimum"
suite = "globalopt"
problem = "lj38"
contract = "stated"
entry_count = 5
remark = "The known minimum is -173.928427 from the Cambridge LJ table, which is the archived eOn stop_energy -173.927427 plus this window. The harness budget is 1000000 force calls. The archived pele basin-hopping maximum on this set is 2.5339e6 and the GMIN nosym maximum is 1.1705e6."

[sample]
starts = 100
layout = "con"

[convergence]
energy_above_minimum = 0.001
energy_minimum = -173.928427
max_force_calls = 1000000

[input]
archive_path = "website/globalopt/lj38/100_lj38.tar.gz"

[metrics]
required = ["force_calls", "force_calls_min", "force_calls_max", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
