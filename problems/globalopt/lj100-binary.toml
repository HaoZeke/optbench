id = "globalopt/lj100-binary"
title = "Binary Lennard-Jones 100"
suite = "globalopt"
problem = "lj100-binary"
contract = "stated"
entry_count = 2
remark = "The archived files record energies. The declared force-call cap is 2000000."

[potential]
kind = "binary-lennard-jones"
n_A = 42
n_B = 58
epsilon_AA = 1.0
epsilon_AB = 1.0
epsilon_BB = 1.0
sigma_AA = 1.0
sigma_BB = 1.3
sigma_AB = "arithmetic mean of sigma_AA and sigma_BB"
energy_minimum = -604.796307

[reference]
energy = -604.7963065717
page = "https://www-wales.ch.cam.ac.uk/CCD.html"
index = "http://www-wales.ch.cam.ac.uk/~wales/CCD/NEW_BINARY_LJ_MINIMA/"
points = "http://www-wales.ch.cam.ac.uk/~wales/CCD/NEW_BINARY_LJ_MINIMA/1.3/100"

[sample]
starts = 100
max_evaluations = 2000000

[convergence]
energy_above_minimum = 0.001
max_force_calls = 2000000

[input]
archive_path = "website/globalopt/lj100-binary/lj100-binary-con.tgz"

[metrics]
required = ["avg_energy", "min_energy", "max_energy"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
