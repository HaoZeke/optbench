id = "globalopt/lj100-binary"
title = "Binary Lennard-Jones 100"
suite = "globalopt"
problem = "lj100-binary"
contract = "stated"
entry_count = 2
remark = "The archived files record energies. They do not record force calls."

[potential]
kind = "binary-lennard-jones"
n_A = 42
n_B = 58
epsilon_AA = 1.0
epsilon_AB = 1.0
epsilon_BB = 1.0
sigma_AA = 1.0
sigma_BB = 1.3
sigma_AB = "arithmetic mean of sigma_AA and sigma_BB"
