id = "globalopt/tip4p20"
title = "tip4p20"
suite = "globalopt"
problem = "tip4p20"
contract = "partial"
entry_count = 2
remark = "Success is an energy at or below the Cambridge Cluster Database TIP4P N=20 minimum plus 0.001. The archive data file at 0f26b796 sets STEPS 4.D7, which is 40000000 basin-hopping steps, and records no force-call cap. benchmark.dat force_calls_max is 1.4191e+08 with nfailed 0, and the published maximum is 141910 thousand. The basin-paving archive maximum is 1.4340e+08. format(143405000, '.4e') is 1.4340e+08 and format(143405001, '.4e') is 1.4341e+08. A count strictly below the cap is inside it, so the cap is 143405001."

[potential]
kind = "tip4p"
rigid = true

[reference]
energy = -872.9887544952
page = "http://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P-water.html"
points = "https://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P/xyz/TIP4P-20.xyz"

[sample]
starts = 100

[convergence]
energy_above_minimum = 0.001
max_force_calls = 143405001

[input]
archive_path = "website/globalopt/tip4p20/100_tip4p20.tar.gz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
