id = "globalopt/lj75"
title = "lj75"
suite = "globalopt"
problem = "lj75"
contract = "partial"
entry_count = 1
remark = "Success is an energy at or below the Cambridge Cluster Database N=75 minimum plus 0.001. The cap of 1000000 force calls is above the archived GMIN maximum of 310110."

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0

[reference]
energy = -397.492331
symmetry = "D5h"
page = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/tables.150.html"
points = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/points/75"

[sample]
starts = 200

[convergence]
energy_above_minimum = 0.001
max_force_calls = 1000000

[input]
archive_path = "website/globalopt/lj75/lj75_clusters.tgz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
