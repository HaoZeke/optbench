id = "globalopt/tip4p15"
title = "tip4p15"
suite = "globalopt"
problem = "tip4p15"
contract = "partial"
entry_count = 2
remark = "Success is an energy at or below the Cambridge Cluster Database TIP4P N=15 minimum plus 0.001. The cap of 10000000 force calls is above the archived GMIN maximum of 6176900."

[potential]
kind = "tip4p"
rigid = true

[reference]
energy = -628.3722525077
page = "http://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P-water.html"
points = "https://www-wales.ch.cam.ac.uk/~wales/CCD/TIP4P/xyz/TIP4P-15.xyz"

[sample]
starts = 500

[convergence]
energy_above_minimum = 0.001
max_force_calls = 10000000

[input]
archive_path = "website/globalopt/tip4p15/500_tip4p15.tar.gz"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.archive]
label = "archive"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the archive table."

[scoring.v2]
version = "par2-rate-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
