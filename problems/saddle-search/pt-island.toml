id = "saddle-search/pt-island"
title = "Pt heptamer island"
suite = "saddle-search"
problem = "pt-island"
contract = "stated"
entry_count = 12

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
cutoff = 9.5
pair_style = "eon-morse"
pbc = [true, true, false]

[goal]
connected_saddles = 27
barrier_below_eV = 1.5

[convergence]
norm = "l2"
force_norm = 1.0e-3
force_unit = "eV/Angstrom"

[input]
geometries = [
  "website/saddle-search/pt-island/pt-island.con",
  "website/saddle-search/pt-island/POSCAR_pt_island",
]

[metrics]
required = ["force_calls", "force_calls_mean_error", "fraction_connected", "total_searches", "unique_saddles"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[connection]
rule = "eon-r2205-per-atom-max"
distance_difference = 0.1

[scoring.v2]
version = "par2-wilson-bootstrap"
cost = "one displacement search: the climb plus the two endpoint minimizations"
success = "index 1 at eigenvalue tolerance 1e-6, force norm at the stop, barrier below 1.5 eV, exactly one endpoint the same as the minimized reactant by the eOn r2205 rule (Matter::perAtomNorm strictly below distance_difference 0.1 angstrom; ProcessSearchJob calls Matter::compare with indistinguishable left false), and not a repeat under AKMCState.find_repeat (absolute barrier difference at most energy_difference 0.01 eV, and the same per-atom test on the saddle)."
note = "The potential is eOn Morse::force: pair energy shifted to zero at the cutoff, raw Morse force, minimum image with floor(x+0.5) on every positive box axis. pair_style eon-morse selects that surface. morse/smooth/linear is a different force. The result file stores the cap: climb budget 1000, 64 calls of overshoot, and two endpoint budgets of 2000. The initial minimization is outside that count. An index-1 saddle that misses the link, the find_repeat novelty test, or the barrier is a failure, and those reasons fall through to divergence. fraction_connected is the 2014 done.py ratio: searches whose result is not Not Connected, divided by searches. unique_saddles counts good saddles, including a barrier at or above 1.5 eV. A repeat stays in that fraction and is not another unique saddle. A legacy file that records only a campaign ratio has no per-search cap, so PAR-2 is not applied to that ratio. The archived eOn config.ini does not set Structure Comparison, so the 0.1 angstrom and 0.01 eV defaults apply. Matter::pbc folds every positive cell axis. Cartesian RMSD 0.5 is not the link and not the novelty test."
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
