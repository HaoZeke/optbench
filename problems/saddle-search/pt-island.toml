id = "saddle-search/pt-island"
title = "Pt heptamer island"
suite = "saddle-search"
problem = "pt-island"
contract = "stated"
entry_count = 12

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
cutoff = 9.5
pair_style = "morse/smooth/linear"
pbc = [true, true, false]

[goal]
connected_saddles = 27
barrier_below_eV = 1.5

[convergence]
norm = "l2"
force_norm = 1.0e-3
force_unit = "eV/Angstrom"

[input]
geometries = [
  "website/saddle-search/pt-island/pt-island.con",
  "website/saddle-search/pt-island/POSCAR_pt_island",
]

[metrics]
required = ["force_calls", "force_calls_mean_error", "fraction_connected", "total_searches", "unique_saddles"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[connection]
rule = "eon-r2205-per-atom-max"
distance_difference = 0.1

[scoring.v2]
version = "par2-wilson-bootstrap"
cost = "one displacement search: the climb plus the two endpoint minimizations"
success = "index 1 at eigenvalue tolerance 1e-6, force norm at the stop, and exactly one endpoint the same as the minimized reactant by the eOn r2205 rule: Matter::perAtomNorm strictly below distance_difference 0.1 angstrom. ProcessSearchJob calls Matter::compare with indistinguishable left false. The barrier window and the saddle-novelty test count the catalogue. They do not reject a connected index-1 saddle."
note = "The result file stores the cap: climb budget 1000, 64 calls of overshoot, and two endpoint budgets of 2000. The initial minimization is outside that count. A finite search that does not reach an index-1 saddle is not_converged. An index-1 saddle that misses the link is wrong_stationary. A finite clean stop is not divergence. A legacy file that records only a campaign ratio has no per-search cap, so PAR-2 is not applied to that ratio. The archived eOn config.ini does not set Structure Comparison, so the 0.1 angstrom default applies. Matter::pbc folds every positive cell axis."
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_not_converged",
  "n_crash",
]
