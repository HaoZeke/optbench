id = "saddle-search/pt-island"
title = "Pt heptamer island"
suite = "saddle-search"
problem = "pt-island"
contract = "stated"
entry_count = 12

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
cutoff = 9.5
pair_style = "morse/smooth/linear"
pbc = [true, true, false]

[goal]
connected_saddles = 27
barrier_below_eV = 1.5

[convergence]
norm = "l2"
force_norm = 1.0e-3
force_unit = "eV/Angstrom"

[input]
geometries = [
  "website/saddle-search/pt-island/pt-island.con",
  "website/saddle-search/pt-island/POSCAR_pt_island",
]

[metrics]
required = ["force_calls", "force_calls_mean_error", "fraction_connected", "total_searches", "unique_saddles"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean."

[scoring.v2]
version = "par2-wilson-bootstrap"
cost = "campaign total of harness force calls through the search that records the 27th good saddle below 1.5 eV"
search_budget = 5064
success = "27 good saddles below 1.5 eV. A good saddle is index 1 at eigenvalue tolerance 1e-6, force norm at the stop, barrier below 1.5 eV, and exactly one endpoint within Cartesian RMSD 0.5 of the minimized minimum. The substrate pins the frame, so the RMSD is Cartesian."
note = "search_budget is the budget of one displacement search: climb 1000, 64 calls of overshoot, and two endpoint minimizations of 2000. The initial minimization is outside that count. search_budget is not the budget of the 27-saddle campaign. A search at or above 5064 fails that search and the campaign continues. The ranked cost is the harness force-call total from the start through the search that records the 27th good saddle below 1.5 eV. A campaign that never records that saddle is scored by the harness force calls it spent. There is no campaign cap, so that spent total is not doubled. A result that stores one row per displacement search, and does not store that campaign total, stays off this ranked table."
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
