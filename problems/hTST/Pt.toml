id = "hTST/Pt"
title = "Pt"
suite = "hTST"
problem = "Pt"
contract = "partial"
entry_count = 11
remark = "The start is the archive reactant. Ranked rows are harness scores of that start under the archive force and dimer stops. The 2014 table is a separate legacy mean."

[sample]
starts = 1

[input]
archive_path = "website/hTST/Pt/eon-dimer-lbfgs2/pos.con"

[metrics]
required = ["barrier_force_calls", "barrier_jobs", "rate_force_calls", "rate_jobs"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
