id = "hTST/Al"
title = "Al"
suite = "hTST"
problem = "Al"
contract = "shared"
entry_count = 2
remark = "A start is one barrier window. The window closes when each reference barrier below 0.4 eV has been matched once from the processtable. The ranked cost counts every force evaluation: dimer images, minimizations, and prefactor calls. The rate sum uses the search row's harmonic prefactor when the row carries one, and 1.2e12 otherwise. The stop is the maximum force on any atom. The potential is eam_al."

[potential]
evaluator = "eam_al"
kind = "eam"
name = "eam_al"

[htst]
temperature = 300
rate_ref = 592041917.0
rate_accuracy = 0.999
prefactor = 1.2e12
kb = 8.6173324e-5
barrier_ceiling = 0.4
barriers = [0.233, 0.233, 0.233, 0.233, 0.372, 0.372, 0.372, 0.372]

[convergence]
norm = "max_atom"
force_norm = 0.001
force_unit = "eV/Angstrom"

[sample]
starts = 639

[input]
archive_path = "website/hTST/Al/eon-dimer-cg/pos.con"

[metrics]
required = ["barrier_force_calls", "barrier_jobs", "rate_force_calls", "rate_jobs"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
cost = "one barrier window: sad-fcs summed until every reference barrier has been seen once"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_not_converged",
  "n_crash",
]
