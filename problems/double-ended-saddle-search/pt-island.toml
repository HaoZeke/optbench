id = "double-ended-saddle-search/pt-island"
title = "pt-island"
suite = "double-ended-saddle-search"
problem = "pt-island"
contract = "shared"
entry_count = 11

[convergence]
norm = "l2"
force_norm = 0.001
force_unit = "eV/Ang"
max_force_calls = 3000

[band]
interior_images = 3
max_move = 0.2
potential = "morse_pt"

[sample]
pairs = 59

[input]
archive_path = "website/double-ended-saddle-search/pt-island/pt-island-con.tgz"

[geometry]
kind = "con-reactant-products"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
