id = "mlopt/C2H4"
title = "C2H4"
suite = "mlopt"
problem = "C2H4"
contract = "partial"
entry_count = 6
remark = "The ranked Optax force rows are the finite-difference fingerprint derivative. The neighbor list is held fixed and the cutoff is the value in fpParas.dat. PyAMFF python loop_FPs at 8037eb98 sorts neighbor indices and leaves the periodic offsets unsorted. On this trajectory that pairing does not change the stored neighbor blocks. calculate_dG2 raises UnboundLocalError on every image, so the python path has no force loss. The archived configs set fp_engine to Fortran. That Fortran derivative was not executed. There is no separate paper-comparable row. templates/optax/README.md has the comparison."

[sample]
initializations = 50
initialization = "uniform[-1, 1)"

[convergence]
max_epochs = 10000
force_training_max_epochs = 30000
energy_only_grad_norm = 0.02
force_training_grad_norm = 0.1

[input]
archive_path = "website/mlopt/C2H4/C2H4_md.traj"

[metrics]
required = ["mean_energy_rmse", "mean_epoch", "mean_force_rmse", "median_energy_rmse", "median_epoch", "median_force_rmse", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
