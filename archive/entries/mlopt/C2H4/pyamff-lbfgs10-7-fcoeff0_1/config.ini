[Main]
run_type = trainFF
Trajectory_file = C2H4_md.traj
use_cohesive_energy = False
energy_training = TRUE
force_training  = True
scaler_type = NoScaler
adjust = False
epochs_max = 30000

[Parallelization]
process_num = 1
master_addr = 127.0.0.2
batch_num_per_proc = 1
thread_num = 1
mp_start_method = spawn

[Fingerprints]
fp_type = BP
fp_engine = Fortran
fp_parameter_file = fpParas.dat 
fp_use_existing = False
fp_file = fps.pckl

[MachineLearningModel]
model_type = neural_network
hidden_layers = 10 7
activation_function = tanh
initial_weights = random_uniform

[LossFunction]
loss_type = SE
energy_coefficient = 1.0
force_coefficient  = 0.1

[Optimizer]
optimizer_type = LBFGS
write_final_grads =True
loss_grad_tol = 0.10
learning_rate = 0.01
