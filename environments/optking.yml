# OptKing is not a conda-forge package. This file does not invent a
# build. The optimizer the benchmarks run is the source pin in
# codes/registry.toml under id optking:
#   repository = https://github.com/psi-rking/optking
#   commit = 767e2c0c13ff2b851ac82101ccd5aab9a558a4f1
#   version string 0.5.1.dev2+g767e2c0c1
# asv has one environment_type, so this yml cannot be bound to one
# class. The campaign extra installs that git revision. Minimization
# classes call the harness Lennard-Jones potential.
name: optking
channels:
  - conda-forge
dependencies:
  - python=3.12
