# eOn develop is not a conda-forge package. This file does not select
# eon=3.6.0 and it does not invent a build string. The binary the
# develop benchmarks run is the source build pinned in
# codes/registry.toml under id eon-develop:
#   ref = develop
#   commit = f6817b537ec1d1563420023fb45fbd0e5b75e7fd
#   version string 3.6.0 (f6817b53)
# asv has one environment_type, so this yml cannot be bound to one
# class. Those classes call EONCLIENT. environments/eon-3.5.0.yml
# remains the conda-forge 3.5.0 pin.
name: eon-develop
channels:
  - conda-forge
dependencies:
  - python=3.12
