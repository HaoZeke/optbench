# eOn SVN r2549 is not a git commit and not a conda-forge package.
# codes/registry.toml id eon-svn pins revision 2549.
# The client must print "eonclient version r2549".
# Historical paths in that revision are forbidden, so the tree is
# fetched file by file. QSC is absent at r2549 and has to be dropped
# from the build. NO_FORTRAN leaves out the Fortran Aluminum potential.
# The client in templates/eon-svn/README is built without NO_FORTRAN.
# asv has one environment_type, so this yml is not bound to a class.
# The benchmarks call EON_SVN_CLIENT.
name: eon-svn
channels:
  - conda-forge
dependencies:
  - python=3.12
