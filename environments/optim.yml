# OPTIM is not a conda-forge package. This file does not select a
# build string. The binary the benchmarks run is the source build
# pinned in codes/registry.toml under id optim:
#   ref = svn.tar.bz2
#   commit = 02aaf45245af7b521b5792fa77ffa364f67d756327ea9e4ecf580c4b6f83e24f
#   banner OPTIM version 02aaf452
# asv has one environment_type, so this yml cannot be bound to one
# class. Those classes call OPTIM. The source patch is
# codes/optim/optim-harness.patch, applied in OPTIM/source.
# ALIGN is off. OpenMP is off. BLAS and LAPACK are the system libraries.
name: optim
channels:
  - conda-forge
dependencies:
  - python=3.12
