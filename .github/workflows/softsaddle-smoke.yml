name: softsaddle smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "softsaddle/**"
      - ".github/workflows/softsaddle-smoke.yml"

jobs:
  smoke:
    name: one SoftSaddle batch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Compilers and numeric libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make pkg-config \
            libgsl-dev libboost-dev libblitz-dev

      - name: Build the Morse, Davidson, and Lanczos libraries
        run: sh softsaddle/smoke.sh

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Parallel_Computing_Toolbox

      - name: Run one batch
        uses: matlab-actions/run-command@v3
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/softsaddle/lib
        with:
          command: smoke_entry
          startup-options: -sd ${{ github.workspace }}/softsaddle
