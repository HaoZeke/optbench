name: check

on:
  push:
    branches:
      - main
      - "design/**"
      - "entries/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: oracle and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # asv pins and the ASE per-image track are read with git show <commit>:path
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Tests
        run: uv run pytest

      - name: Oracle check
        run: uv run optbench check

  site-weight:
    name: site weight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # asv pins and the ASE per-image track are read with git show <commit>:path
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          environments: docs

      - name: Build the site
        run: pixi run -e docs html

      - name: Page weight
        run: pixi run -e docs sitesize
