note = "minhocao on the lj150 coordinate archive. ioput, earr tolerances, fingerprint, seed, and the FIRE force tolerance match flame/lj38-minhocao. MDDTINIT is 2 instead of the code default 20. At the ioput cap of 1e5 K the default step crosses the repulsive wall and one evaluation moves an atom from a compact cluster to several million Angstroms. The timestep 2 is the value in tests/minhocao_blj_mhm and keeps the cluster compact at that temperature. GEOFIREDTINIT is 1.d-9 and GEOFIREDTMIN is 1.d-12 because archive pairs sit near 0.02 sigma. failure_cap is the problem max_force_calls 10000000."

