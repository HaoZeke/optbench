note = """eOn, the git client, at develop a7aa57472fb7d823953fd36b78cd755fa4842d30. Built with Fortran. Not a version of SVN EON, and not the 7095b23 pin. Stock dimer and LBFGS: improved and bowl_active_atoms stay at this tree's defaults. The archive keys that this binary reads are set: opt_method lbfgs, converged_force 1e-3, max_move 0.2, max_iterations 1000, min_mode_method dimer, max_energy 5, confine_positive, bowl_breakout, confine_positive_min_active 20, rotations_max 20, converged_angle 5. The ranked unit is one displacement search, the same 16 starts as EON (SVN r2549): atoms 0-6, magnitude 0.1, seed 20261016, from the minimized pt-island.con. client_displace_type load reads that displacement. The potential during the climb is ext_pot on the problem Morse. The harness adds the two endpoint minimizations and applies the connection test. Gaps against the 2014 archive are left as scored."""

[ini.Main]
job = "saddle_search"
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000
max_move = 0.2

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
max_energy = 5.0
displace_magnitude = 0.1
confine_positive = true
bowl_breakout = true
