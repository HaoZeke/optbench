id = "nloptglobal/lj75-lbfgs-bh"
engine = "nlopt"
code = "NLopt"
code_version = "2.11.0"
commit = "88c424d4f458412787df96fcc95218acbca224fd"
algorithm = "BasinHopping"
problem = "globalopt/lj75"
task = "global-minimize"
profile = "default"
tuning = "default"
reducer = "capped"
ranked = true
note = "Basin hopping. Each quench is NLopt LD_LBFGS with eOn's per-step move bound. eOn r2549 defaults Optimizer max_move to 0.2 Angstrom (client/Parameters.cpp:108; docs/optimizer.txt:46-49). archive/entries/globalopt/lj38/eon-basinhopping/config.ini does not set max_move, so that default stands, and lines 11-12 set converged_force = 0.001 and max_iterations = 1000. Convergence is the Euclidean force norm. NLopt 2.11 LD_LBFGS cannot scale an internal step: Luksan PLIS sets xmax to 0, which becomes 1e16, and xmax is the norm of the whole step. Each solve therefore runs inside a coordinate window of half-width max_move centered on the current point, then the accepted displacement is scaled by the eOn rule (client/HelperFunctions.cpp:406-414) so the largest atomic move is at most 0.2, and the window is recentered. That is not one box around the quench. Displacement is 0.5 and kT is 0.8 (config.ini displacement 0.5, temperature 8000; in.lammps lj/cut 40). There is no quadratic core. A coincident pair is the true singularity. A dissociated or non-finite result is a failure. The recorded energy is the harness potential. The seed is the start index. The AVX-512 kernel matches that potential; its energy differs from the scalar sum by about 1e-12 on the LJ98 minimum."

[nlopt]
name = "LD_LBFGS"
displacement = 0.5
temperature = 0.8
max_move = 0.2
converged_force = 0.001
max_iterations = 1000
local_maxeval = 4000

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
rc = 40.0

[classify]
force_norm = 0.01

[stop]
energy_above_minimum = 0.001
max_force_calls = 1000000

[input]
archive_path = "website/globalopt/lj75/lj75_clusters.tgz"
