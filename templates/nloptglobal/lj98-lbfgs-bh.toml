id = "nloptglobal/lj98-lbfgs-bh"
engine = "nlopt"
code = "NLopt"
code_version = "2.11.0"
commit = "88c424d4f458412787df96fcc95218acbca224fd"
algorithm = "BasinHopping"
problem = "globalopt/lj98"
task = "global-minimize"
profile = "default"
tuning = "default"
reducer = "capped"
ranked = true
note = "Basin hopping. Each quench is stock NLopt LD_LBFGS with no step bounds. Displacement is 0.5 and kT is 0.8, the archived eOn basin-hopping schedule (archive/entries/globalopt/lj38/eon-basinhopping/config.ini displacement 0.5, temperature 8000; in.lammps lj/cut 40). There is no NLopt entry under archive/entries/globalopt. The potential is the cutoff 12-6. A coincident pair is the true singularity, not a finite penalty and not a quadratic core. A dissociated or non-finite result is a failure. The recorded energy is the harness potential. The seed is the start index. The AVX-512 kernel matches that potential; its energy differs from the scalar sum by about 1e-12 on the LJ98 minimum."

[nlopt]
name = "LD_LBFGS"
displacement = 0.5
temperature = 0.8
tolg = 1e-5
local_maxeval = 4000

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
rc = 40.0

[classify]
force_norm = 0.01

[stop]
energy_above_minimum = 0.001
max_force_calls = 1000000000

[input]
archive_path = "website/globalopt/lj98/lj98_clusters.tgz"
