id = "rgmin/lj38-lbfgs"
engine = "rgmin"
problem = "minimization/lj38"
code = "rgmin"
code_version = "0.4.1"
commit = "fd26a60ddd48796dcad4af26e4609f64c1c8a842"
algorithm = "LBFGS"
tuning = "default"
note = "Default row. gtol and the iteration budget are the problem force norm and the force-call cap. maxstep is 0.2, the per-atom displacement cap (rgmin atom_maxmove, the same quantity as the eOn max move and the rgmin ASE default). istep is 0.1. BB, FIRE, and quickmin take that gradient trial with no line search. L-BFGS, BFGS, CG, and steepest descent use the session strong Wolfe search, and the first trial is still sized by istep. Adam uses that search on a direction scaled to unit per-atom length, and the next opening is the accepted step. DIIS searches along the GDIIS image when that direction is downhill and otherwise takes one steepest step; the line search chooses the length. SR1 and SR2 take a dogleg or Cauchy step in a trust region and do not line search. Newton and dogleg take a Hessian step inside the same cap. Without the cap, an uncapped gradient trial on these starts leaves the Lennard-Jones cutoff. The same values are used for every start."

[rgmin]
method = "lbfgs"
maxstep = 0.2

[ini.Optimizer]
converged_force = 0.01
max_iterations = 10000
