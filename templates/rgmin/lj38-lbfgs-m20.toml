note = "Default row. gtol and the iteration budget are the problem force norm and the force-call cap. This row fixes L-BFGS memory at 20. The shipped L-BFGS memory is 10. maxstep is 0.2, the per-atom displacement cap (rgmin atom_maxmove, the same quantity as the eOn max move and the rgmin ASE default). The session takes one trial of -istep*g with istep 0.1 and no line search; without this cap that trial leaves the Lennard-Jones cutoff. The same values are used for every start."

