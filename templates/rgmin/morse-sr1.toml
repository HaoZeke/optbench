id = "rgmin/morse-sr1"
engine = "rgmin"
problem = "minimization/morse-bulk"
code = "rgmin"
code_version = "0.4.1"
commit = "fd26a60ddd48796dcad4af26e4609f64c1c8a842"
algorithm = "SR1"
tuning = "default"
note = "Default row. gtol and the iteration budget are the problem force norm and the force-call cap. No displacement cap. istep is 0.1. SR1 stores the direct Hessian and takes a dogleg step when that model is positive definite, otherwise the Cauchy point. With no per-atom cap the trust radius opens at max(istep, 1). There is no line search. The same values are used for every start."

[rgmin]
method = "sr1"

[ini.Optimizer]
converged_force = 1.0e-3
max_iterations = 10000
