id = "rgmin/morse-sr1"
engine = "rgmin"
problem = "minimization/morse-bulk"
code = "rgmin"
code_version = "0.4.1"
commit = "9a2e7ff11fa65826f9e847856bee10d3d70b7156"
algorithm = "SR1"
tuning = "default"
note = "Default row. gtol and the iteration budget are the problem force norm and the force-call cap. The template sets no maxstep, so the Cartesian default per-atom cap of 0.2 applies. istep is 0.1. SR1 stores the direct Hessian and takes a dogleg step when that model is positive definite, otherwise the Cauchy point. The trust radius opens at 0.2 times the square root of the atom count, the Euclidean ball of one capped per-atom step. There is no line search. The same values are used for every start."

[rgmin]
method = "sr1"

[ini.Optimizer]
converged_force = 1.0e-3
max_iterations = 10000
