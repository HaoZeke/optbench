id = "rgmin/lj38-fire2"
engine = "rgmin"
problem = "minimization/lj38"
code = "rgmin"
code_version = "0.4.0"
commit = "24236559f3815847cac89ba0a7be634ce0beb4a9"
algorithm = "FIRE2"
tuning = "default"
note = "Default row. gtol and the iteration budget are the problem force norm and the force-call cap. maxstep is 0.2, the per-atom displacement cap (rgmin atom_maxmove, the same quantity as the eOn max move and the rgmin ASE default). istep is 0.1. BB, DIIS, FIRE, and quickmin take that gradient trial with no line search. L-BFGS, BFGS, CG, steepest descent, Adam, SR1, and SR2 use the session strong Wolfe search, and the first trial is still sized by istep. Newton and dogleg take a Hessian step inside the same cap. Without the cap, an uncapped gradient trial on these starts leaves the Lennard-Jones cutoff. The same values are used for every start."

[rgmin]
method = "fire2"
maxstep = 0.2

[ini.Optimizer]
converged_force = 0.01
max_iterations = 10000
