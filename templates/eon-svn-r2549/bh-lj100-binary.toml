id = "eon-svn-r2549/bh-lj100-binary"
engine = "eon"
problem = "globalopt/lj100-binary"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Basin hopping"
reducer = "harness"
tuning = "default"
failure_cap = 2000000
note = '''
Stock EON SVN r2549 basin hopping on the binary LJ100 starts. Fortran build, client sources unpatched. QSC is not in revision 2549 and this run does not call it. The force-call cap is 2000000. That number is sample.max_evaluations in problems/globalopt/lj100-binary.toml and the archive report.sh window ($2 <= 2e6). A start that reaches the cap is charged 4000000. The ini is the archive config.ini: temperature 14000, 60000 basin-hopping steps, displacement 0.3 (the archive names this max_displacement; r2549 reads displacement), gaussian draws, significant_structure, swap_probability 0, L-BFGS, converged_force 0.001, max_iterations 10000. random_seed is 1 so the recorded run is not the clock. The harness counts every ext_pot force call and stops at the cap. The potential is the archive in.lammps binary Lennard-Jones: first species sigma 1.3, second sigma 1.0, cross 1.15, epsilon 1, cutoff 20, no shift.
'''

[ini.Main]
job = "basin_hopping"
quiet = true
write_log = false
temperature = 14000
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini."Basin Hopping"]
steps = 60000
displacement = 0.3
significant_structure = true
displacement_distribution = "gaussian"
swap_probability = 0.0

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 10000
