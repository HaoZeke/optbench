id = "eon-svn-r2549/bh-lj100-binary"
engine = "eon"
problem = "globalopt/lj100-binary"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Basin hopping"
reducer = "harness"
tuning = "default"
failure_cap = 2000000
note = '''
Stock EON SVN r2549 basin hopping on the binary LJ100 starts. Fortran build, client sources unpatched. QSC is not in revision 2549 and this run does not call it. The force-call cap is 2000000. That number is sample.max_evaluations in problems/globalopt/lj100-binary.toml and the archive report.sh window ($2 <= 2e6). Archive config.ini sets 60000 basin-hopping steps and an inner L-BFGS limit of 10000 iterations. This run keeps the r2549 defaults for temperature, displacement, optimizer, and step count (300 K, displacement 0.5, conjugate gradient, 10000 steps, inner max_iterations 1000) and sets the archive force tolerance 0.001. random_seed is 1 so the recorded run is not the clock. The harness counts every ext_pot force call and stops at the cap. The potential is the archive in.lammps binary Lennard-Jones: first species sigma 1.3, second sigma 1.0, cross 1.15, epsilon 1, cutoff 20, no shift.
'''

[ini.Main]
job = "basin_hopping"
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini.Optimizer]
converged_force = 0.001
