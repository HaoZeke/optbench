id = "eon-git/de-pt-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "eOn (develop a7aa57472fb7)"
code_version = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Lanczos"
reducer = "harness"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse"
tuning = "stock"
note = '''
Stock eOn develop a7aa57472fb7d823953fd36b78cd755fa4842d30 on the same Pt-island Lanczos problem, starts, and convergence criterion as the archive. The ini is the 2014 file: L-BFGS converged_force 0.001, max_iterations 1000, Lanczos max_iterations 10, tolerance 0.05, quit_early true, max_energy 1e9. Unset keys stay at the develop defaults. The C++ client default client_displace_type is load, so direction.dat from the interpolated product is the start. The harness counts the same morse/smooth/linear surface as the EON r2549 stock row and sets random_seed 1. This is not a tune toward the archive mean.
'''
seeds = [1]

[ini.Main]
job = "saddle_search"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Saddle Search"]
max_iterations = 1000
min_mode_method = "lanczos"
max_energy = 1000000000.0

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = true
