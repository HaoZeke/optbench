id = "geomoptjl/morse-lbfgs"
engine = "geomoptjl"
problem = "minimization/morse-bulk"
code = "GeometryOptimization.jl"
code_version = "0.1.6"
commit = "5b145886c19042f2ef13e21627f28d86027f719c"
algorithm = "LBFGS"
tuning = "default"
note = "GeometryOptimization 0.1.6 OptimLBFGS uses the Hager-Zhang initial step. BackTracking linesearch of order 2 and maxstep 0.8 bohr. The iteration ceiling is the force-call cap. The potential is the harness callback. The callback stops at the Euclidean force norm 0.001 eV/Å. Positions are angstrom and the energy is eV. The solver converts those to atomic units internally. The recorded force is the spec gradient in eV/Å."

[geomoptjl]
method = "lbfgs"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
