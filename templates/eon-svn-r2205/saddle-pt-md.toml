id = "eon-svn-r2205/saddle-pt-md"
engine = "eon"
problem = "saddle-search/pt-island"
code = "Eon svn"
code_version = "r2205"
commit = "r2205"
entry = "archive/entries/saddle-search/pt-island/eon-md"
algorithm = "dynamics AKMC"
note = '''
Archived saddle-search/pt-island/eon-md config.ini. A later duplicate key replaces the earlier one. potential is the built-in morse_pt potential. done.py stops at 27 good saddles below 1.5 eV. report.sh averages the replicates and sets no force-call cap. The client pin is r2205. The archived-versus-rerun table is docs/eon-svn-paper.md.
'''

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
converged_force = 1e-3
max_iterations = 1000
opt_method = "lbfgs"
max_move = 0.2

[ini.AKMC]
confidence = 1.1
confidence_scheme = "dynamics"
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
number_of_cpus = 8
num_jobs = 8

[ini."Nudged Elastic Band"]
images = 3
max_iterations = 100
spring = 5.0
climbing_image_method = true
converged_force = 0.1

[ini."Saddle Search"]
method = "dynamics"
dynamics_temperature = 2800
dynamics_state_check_interval = 600
dynamics_record_interval = 40
dynamics_linear_interpolation = true
max_energy = 1000
max_iterations = 300

[ini."Parallel Replica"]
dephase_time = 0

[ini.Dynamics]
time_step = 2.0
time = 10000
thermostat = "langevin"
langevin_friction = 0.004

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.Prefactor]
default_value = 5e12
