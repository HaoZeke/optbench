id = "eon-svn-r2205/saddle-pt-dimer"
engine = "eon"
problem = "saddle-search/pt-island"
code = "Eon svn"
code_version = "r2205"
commit = "r2205"
entry = "archive/entries/saddle-search/pt-island/eon-dimer"
algorithm = "dimer"
note = '''
Archived saddle-search/pt-island/eon-dimer config.ini. A later duplicate key replaces the earlier one. potential is the built-in morse_pt potential. done.py stops at 27 good saddles below 1.5 eV. report.sh averages the replicates and sets no force-call cap. The client pin is r2205. The archived-versus-rerun table is docs/eon-svn-paper.md.
'''

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
converged_force = 1e-3
max_iterations = 1000
opt_method = "lbfgs"
max_move = 0.2

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_cpus = 8

[ini."Saddle Search"]
displace_listed_weight = 1
displace_all_listed = false
displace_radius = 3.3
displace_atomlist = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
min_mode_method = "dimer"
max_energy = 5.0
max_iterations = 1000

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.Prefactor]
default_value = 5e12
