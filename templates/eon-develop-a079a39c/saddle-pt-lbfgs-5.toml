note = """Stock AKMC on the Pt island from https://github.com/TheochemUI/eon commit a079a39c69160200f6fc39b862b09af72583c62c on develop, Fortran build, algorithm untuned, labelled eOn (develop a079a39c). It is not the SVN code. The 2014 archive row stays the archived number. Optimizer L-BFGS, dimer rotations_max 5, converged_force 0.001, max_energy 5, temperature 700, confidence 1.1, thermally_accessible_window 99999, prefactor 5e12, displacement of atoms 0-6 at radius 3.3 and magnitude 0.1. Dimer improved and the rotation optimizer stay at that commit's defaults. The harness kernel is morse/smooth/linear, cutoff 9.5, periodic in x and y. Seeds 1 through 9, the pt-island start. The pass limit is only a ceiling. The stop is 27 good saddles below 1.5 eV. Each ranked cost is that campaign's harness force-call total. The cap is 100000000."""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_all_listed = false
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Dimer]
rotations_max = 5
converged_angle = 5.0
