# i-PI 3.3.1 string. The problem file supplies the image count, the cap, and the force norm.
# bfgstrm is the library default. Its trust-region loop stops requesting forces
# once a rejected step does not move, so this row uses damped_bfgs.
id = "ipi/string"
engine = "ipi-band"
code = "i-PI"
code_version = "3.3.1"
commit = "a6b350327ce7cb8fdcc17192b1b9af88513b662f"
algorithm = "String"
tuning = "default"

[ipi]
method = "string"
optimizer = "damped_bfgs"
climb = false
stage = "string"
tangent = "improved"
spring_k = 1.0
