# i-PI 3.3.1 climbing-image string. The problem file supplies the image count, the cap, and the force norm.
# bfgstrm is the string default. On one climbing bead its trust-region loop stops
# requesting forces once a rejected step does not move, so this row uses damped_bfgs.
id = "ipi/ci-string"
engine = "ipi-band"
code = "i-PI"
code_version = "3.3.1"
commit = "a6b350327ce7cb8fdcc17192b1b9af88513b662f"
algorithm = "CI-String"
tuning = "default"

[ipi]
method = "string"
optimizer = "damped_bfgs"
climb = true
stage = "climb"
tangent = "improved"
spring_k = 1.0
