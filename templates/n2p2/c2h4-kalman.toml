algorithm = "Kalman"
tuning = "default"
starts = 50
note = "Energy-only squared error on the pyamff fingerprints and the 10-7 tanh network. The loss sums the squared per-atom energy error over the C2H4 trajectory. The problem file states no epoch cap. This row uses the same 10000 evaluations and 0.02 max-abs gradient tolerance as the energy-only EMT problem and the fcoeff0 archive. One force call is one full loss-gradient evaluation. The standard Kalman filter uses the recommended n2p2 parameters, with qtau and etatau divided by the 570 structures. Each epoch visits every structure once, in a PCG64 permutation drawn after the uniform[-1, 1) weights. The seed is 20261015 plus the start index. The observation is the total-energy residual and its Jacobian. Force RMSE is -1 because this row does not train forces."

[stop]
max_force_calls = 10000
grad_abs = 0.02

