note = "Force-trained squared error on the pyamff fingerprints and the 10-7 tanh network. The archived fcoeff0_1 configs use energy coefficient 1, force coefficient 0.1, loss_grad_tol 0.1, and epochs_max 30000. The EMT problem states force_training_grad_norm 0.1; its max_epochs 10000 is the energy-only cap. One force call is one combined loss-gradient evaluation. The standard Kalman filter uses examples/input.nn.recommended: epsilon 0.01, q0 0.01, qtau 2.302, qmin 1e-6, eta 0.01, etatau 2.302, etamax 1, force_weight 1, force_energy_ratio 3, and one structure or one force component per update. qtau and etatau are divided by the projected updates in an epoch, 500 energy updates plus 1500 force updates. Each epoch visits every structure and that force sample, in a PCG64 permutation drawn after the uniform[-1, 1) weights. The seed is 20261015 plus the start index. Dataset normalization stays off so the loss stays the pyamff NoScaler loss; units.rst marks normalization optional."

[stop]
max_force_calls = 30000
grad_abs = 0.1

