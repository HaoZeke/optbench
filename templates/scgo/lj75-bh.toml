note = "Basin hopping keeps the documented SCGO gas-cluster step and Metropolis scale: dr 0.2 angstrom and temperature 1.0 eV, from the BH table in docs/source/parameters.rst and from get_default_params. Local FIRE length stays the 75-atom automatic size, 266 steps. The hop count is 1000000, the same number as max_force_calls on globalopt/lj75, so a short FIRE relaxation cannot end the search early. A start stops when the harness energy is within 0.001 of reference.energy -397.492331, or when that cap is spent. Seed 314159 matches the archived eOn basin-hopping config. Energies and forces come from optbench.potentials.lennard_jones. The atom symbol is carbon, a label for the SCGO distance floor."

[scgo]
algorithm = "bh"
symbol = "C"
seed = 314159
dr = 0.2
temperature = 1.0
niter = 1000000
