note = "eOn is the git code at https://github.com/TheochemUI/eon, not EON. This row is 500350d9fae881f06c7ef194e5868da079c4be5a on fix/develop-regressions-vs-350, stock and unmodified. ImprovedDimer CG uses theta = F_R + thetaOld * gamma, then removes the component along tau. r2006 uses theta = F_R + thetaOld * F_R_Old.norm() * gamma. The ini matches the archive file: confidence 1.9, rotations_max 50, converged_angle 1, morse_pt, seed 42, converged_force 0.001, max_iterations 5000, and the archive displacement. Finite difference, the convergence metric, the thermal window, and the dimer optimizer stay at this revision's defaults. A start is one barrier window. The archived mean is over 9."

