# CP2K 2026.2 string method with the same MD settings as the CI-NEB and IT-NEB regtests.
# Manual: https://manual.cp2k.org/trunk/CP2K_INPUT/MOTION/BAND.html
# K_SPRING 0.05, TIMESTEP 0.5 fs, TEMPERATURE 100 K, ANNEALING 0.95.
# E, Ren, and Vanden-Eijnden, Phys. Rev. B 66, 052301 (2002), doi:10.1103/PhysRevB.66.052301.
# neb_methods.F warns that MD optimization and the string method are incompatible, and the run continues.
id = "cp2k/string-tuned"
engine = "cp2k-band"
code = "CP2K"
code_version = "2026.2"
commit = "67b5da876dd6a76b8b021d5a04d1c81ba79a4c50"
algorithm = "SM"
tuning = "tuned"

[band]
band_type = "SM"
opt_type = "MD"
k_spring = 0.05
timestep = 0.5
temperature = 100.0
annealing = 0.95
