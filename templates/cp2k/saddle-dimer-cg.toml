id = "cp2k/saddle-dimer-cg"
engine = "cp2k"
problem = "saddle-search/pt-island"
code = "CP2K"
code_version = "2026.2"
commit = "702cc3d81422b92864ecdd7f544c21c56c04adca"
algorithm = "Dimer CG"
tuning = "default"
ranked = true
note = "Stock GEO_OPT stop. MAX_ITER is 200. MAX_FORCE is 4.5e-4 Ha/bohr and RMS_FORCE is 3.0e-4 Ha/bohr, both multiplied by the socket scale 0.05. CP2K applies those limits to the dimer-modified gradient. The harness measures the raw Euclidean norm, which stays above 0.001, so the class is divergence. DR is the stock 0.01 angstrom. ANGLE_TOLERANCE is 1 degree. The two-point step cap is 0.05 bohr."

[cp2k]
task = "dimer"
optimizer = "CG"
rot_optimizer = "CG"
force_match = "library"
model_hessian = true
cg_line_search = "2PNT"
rot_max_iter = 200
max_iter = 200

[stop]
norm = "l2"
force_norm = 0.001

[search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
rmsd_connect = 0.5
max_searches = 20000
