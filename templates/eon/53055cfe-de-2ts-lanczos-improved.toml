The binary is eOn develop 53055cfe, built from that commit with no source patch. Lanczos L-BFGS on the interpolated pair with quit_early true. Lanczos max_iterations 20, tolerance 0.05, optimizer max_move 0.1, converged_force 0.001. The stop is the L2 norm. Optimizer max_iterations, saddle-search max_iterations, and failure_cap are 250000. The Lanczos subspace size stays at 20. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
