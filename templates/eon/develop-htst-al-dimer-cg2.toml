id = "eon/develop-htst-al-dimer-cg2"
engine = "eon"
problem = "hTST/Al"
code = "eOn (develop 500350d9)"
code_version = "500350d9"
commit = "500350d9fae881f06c7ef194e5868da079c4be5a"
algorithm = "Dimer-CG rotation: max=10 tol=1"
reducer = "harness"
failure_cap = 2000000
seeds = [42]
starts = ["al"]
geometry = "website/hTST/Al/eon-dimer-cg2/pos.con"
pass_limit = 1
workers = 1
note = """
eOn at 500350d9 on fix/develop-regressions-vs-350. This is not EON. The binary is unpatched, eonclient -v prints 3.6.0 (500350d9), and commit 44931a78 counts saddle calls through every image potential. The harness replaces the potential with ext_pot and counts every force() through the same Aluminum Fortran kernel as the r2549 row. The ini is the archive displacement and convergence: temperature 300, seed 42, confidence 1.95, prefactor 1.2e12, converged_force 0.001, max_iterations 5000, dimer CG, rotations_max 10, converged_angle 1, radius 3.3, magnitude 0.5, listed adatom 384 (archive displace_atomlist -1, the last atom). A lone -1 in this tree means every free atom, so the written list is the last atom, index 384. finite_difference and improved stay at this tree's defaults. One AKMC stays on state 0. scripts/htst_al_continuous.py walks that run the way archive/entries/hTST/Al/eon-dimer-cg2/report.py walks states/0/search_results.txt. Barrier counters reset once every reference process id has been seen, and the rate sum resets at 0.999 of 592041917. The run stops after 432 barrier windows and 11 rate windows. The problem file states no force-call cap, so the server counter does not end the AKMC on failure_cap. The harness total is the count.
"""

[ini.Main]
job = "akmc"
temperature = 300
random_seed = 42

[ini.Potential]
potential = "eam_al"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.95

[ini.Prefactor]
default_value = 1.2e12

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 1
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1.0
displace_atom_list = "384"
displace_radius = 3.3
displace_magnitude = 0.5
max_energy = 100.0

[ini.Dimer]
opt_method = "cg"
converged_angle = 1
rotations_max = 10
