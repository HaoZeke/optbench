id = "eon/develop-saddle-pt-lbfgs-20"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn"
code_version = "(develop 500350d9)"
commit = "500350d9fae881f06c7ef194e5868da079c4be5a"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 100000000
tuning = "default"
note = """eOn, the git code at https://github.com/TheochemUI/eon, develop 500350d9 on fix/develop-regressions-vs-350. This is not a version of EON. The method the row names is the setup: Optimizer opt_method lbfgs and Dimer rotations_max 20, written with the develop keys. Dimer improved and dimer opt_method stay unset, so the develop defaults remain. Main.parallel stays at its default. The other ini keys are the archive AKMC problem: converged_force 0.001, temperature 700, confidence 1.1, thermally_accessible_window 99999, minimize_first, displacement atoms 0-6 with radius 3.3 and magnitude 0.1, max_energy 5, prefactor default_value 5e12. The potential the client evaluates is ext_pot. The harness kernel is morse/smooth/linear. One campaign stops at 27 connected saddles below 1.5 eV. A connected saddle is a minimized endpoint pair in which exactly one endpoint lies within the archive distance_difference of 0.1 Å (minimum image on the stored cell, with a bijection for identical atoms). The ranked cost is sad-fcs plus mins-fcs through that saddle. Commit 500350d9 charges that sum with potRegistryForceCalls, so every image potential in the process is included. On a7aa574 the same job added only pot->forceCallCounter. Main.parallel is the default and the dimer builds a second potential for the other image, so the PotServer total was 4261497 while the registered sum was 2208099. The campaign cap is 100000000 force calls. Prefactor calls stay at 0 because default_value skips the Hessian, which is the archive sum."""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "ext_pot"
ext_pot_path = "extpot-bridge"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000
max_move = 0.2

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 10
number_of_CPUs = 4
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.Prefactor]
default_value = 5e12
