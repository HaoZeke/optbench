problem = "neb/Pt-heptamer"
code = "eOn"
code_version = "(develop bbe4ffba)"
commit = "bbe4ffbad32b8a479bf171cd7ff1497e363940e3"
algorithm = "LBFGS"
kind = "neb-pt"
reducer = "harness"
failure_cap = 10000
note = "Climbing-image NEB on the 13 Pt-heptamer bands at develop bbe4ffbad32b8a479bf171cd7ff1497e363940e3. opt_backend is unset, so the binary keeps the eon backend. The ini matches eon/neb-pt-lbfgs, including climbing_image_converged_only, setup_mmf_peaks, and lbfgs_accept energy. The path initialiser is the binary default, linear. force_calls is the harness total across the band. A termination_reason of 0 under the cap 10000 is a success."

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.01
max_move = 0.2
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 8
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
climbing_image_band_slack = 10.0
