id = "eon/htst-al-dimer"
engine = "eon"
problem = "hTST/Al"
code = "eOn"
code_version = "3.6.0"
commit = "1d71c944501832bfafb955ffe13b9aae50c8efd4"
algorithm = "Dimer-CG rotation: max=50 tol=1"
reducer = "harness-htst"
pass_limit = 4000
note = "AKMC on the Al adatom with potential eam_al. Temperature 300 K, seed 42, confidence 1.95, confidence_scheme old. Dimer rotation is conjugate gradient. improved is the eOn default, true. rotations_max 50, converged_angle 1. The 2014 ini sets displace_atomlist = -1. That manual means the last atom. This eOn treats -1 as every free atom, so the list is file index 384, the adatom. Radius 3.3, magnitude 0.5, listed weight 1. Optimizer and saddle converged_force are 0.001 with convergence_metric max_atom, max_iterations 5000, saddle max_energy 100. Prefactor default_value is 1.2e12. A start is one barrier window from optbench.htst. Communicator num_jobs 32."

[ini.Main]
job = "akmc"
temperature = 300
finite_difference = 0.001
random_seed = 42

[ini.Potential]
potential = "eam_al"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "max_atom"
converged_force = 0.001
max_move = 0.2
max_iterations = 5000

[ini.AKMC]
confidence = 1.95
server_side_process_search = false
confidence_scheme = "old"
thermally_accessible_window = 20

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1.0
displace_atom_list = "384"
displace_radius = 3.3
displace_magnitude = 0.5
max_energy = 100.0
max_iterations = 5000
converged_force = 0.001

[ini.Prefactor]
default_value = 1.2e12

[ini.Dimer]
improved = true
opt_method = "cg"
converged_angle = 1
rotations_max = 50
rotations_min = 1
finite_angle = 0.005
