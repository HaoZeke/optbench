note = "eOn (develop a7aa57472fb7d823953fd36b78cd755fa4842d30), the current TheochemUI/eon develop tree, stock. This is not EON SVN. The ini is the archived keys only: temperature 700 K, seed 42, confidence 1.9, Lanczos tolerance 0.05, max_iterations 50, converged_force 0.001, max_iterations 5000, least-coordinated displacement weight 1, radius 3.3, magnitude 0.3, prefactor 1.2e12. finite_difference, convergence_metric, thermally_accessible_window, quit_early, and the climb method stay at the develop defaults. A start is one barrier window. Communicator num_jobs 32."

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
