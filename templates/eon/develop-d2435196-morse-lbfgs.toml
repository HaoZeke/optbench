note = "L-BFGS on the Morse bulk stop at develop d2435196c6dd7b70def58c52f2ece44349f82ca9. opt_backend is unset, so the binary keeps the eon backend. The ini matches eon/morse-lbfgs, including lbfgs_accept energy. Potential morse_pt, counted by the harness. The force stop is 0.001. Hessian index uses the full eigenvalue list and tolerance 1e-6."

