id = "eon/53055cfe-low-lj38-lanczos"
engine = "eon"
problem = "lowest-eigenvector/lj38"
code = "eOn"
code_version = "(develop 53055cfe)"
commit = "53055cfe4ee7d12904c0915de583be0859b48536"
algorithm = "Lanczos"
reducer = "lowest-overlap"
failure_cap = 10000
note = "The binary is eOn develop 53055cfe, built from that commit with no source patch. Lowest mode of the 200 LJ38 geometries. Saddle Search max_iterations is 0. Lanczos tolerance is 0 and quit_early is false. The harness raises Lanczos max_iterations from 1 to 1000 and keeps the smallest value whose absolute overlap with the reference mode is at least 0.99. The recorded total_force_calls are that successful run. nfailed counts geometries that never reach the overlap. Potential ljcluster. direction.dat is the numpy seed 314159 mode used for every geometry. client_displace_type load. Main random_seed is 1."

overlap = 0.99
iteration_limit = 1000

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini."Saddle Search"]
max_iterations = 0
min_mode_method = "lanczos"
client_displace_type = "load"
displace_magnitude = 0.1

[ini.Lanczos]
tolerance = 0
max_iterations = 1
quit_early = false
