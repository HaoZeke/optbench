id = "eon/develop-saddle-pt-lbfgs-5"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn (develop a7aa57472fb7)"
code_version = "a7aa57472fb7"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Dimer"
reducer = "harness"
failure_cap = 100000000
tuning = "default"
kind = "akmc"
kernel = "morse"
asv_class = "EonDevelopSaddlePtLbfgs5"
asv_full = false
asv_timeout = 7200
seeds = [1]
starts = ["pt-island"]
pass_limit = 5000
workers = 4
note = """Stock develop AKMC on the Pt island. The archived paper row stays the 2014 number. This run is current develop of https://github.com/TheochemUI/eon at a7aa57472fb7d823953fd36b78cd755fa4842d30, Fortran build, algorithm untuned, labelled eOn (develop a7aa57472fb7). It is not the SVN code. Optimizer L-BFGS, dimer rotations_max 5, converged_force 0.001, max_energy 5, temperature 700, confidence 1.1, thermally_accessible_window 99999, prefactor 5e12, displacement of atoms 0-6 at radius 3.3 and magnitude 0.1. Dimer improved and the rotation optimizer stay at the develop defaults. The harness kernel is morse/smooth/linear, cutoff 9.5, periodic in x and y. One seed, the pt-island start. The pass limit is only a ceiling. Success is 27 good saddles below 1.5 eV."""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_all_listed = false
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Dimer]
rotations_max = 5
converged_angle = 5.0
