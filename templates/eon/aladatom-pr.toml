id = "eon/aladatom-pr"
engine = "eon"
problem = "accelerated-md/aladatom"
code = "eOn"
code_version = "3.6.0"
commit = "1d71c944501832bfafb955ffe13b9aae50c8efd4"
algorithm = "Parallel replica Langevin"
reducer = "amd-catalogue"
failure_cap = 1000000000
escapes = 40
batch_limit = 500
note = "Parallel replica on the 151-atom Al adatom with the built-in eam_al potential at 250 K. Langevin friction is 0.001 per fs. The timestep is 1 fs. Each replica dephases for 1000 fs and the block is 20000 fs. A quench every 500 fs is compared with the minimized reactant at 0.1 A. The transition time is refined to the 10 fs save interval. The local client does not cancel the other replicas, so the physical time of a batch that escaped is every replica's time up to the earliest transition. A batch with no escape adds the sum of the block times. The rate is the number of escapes divided by that time. The uncertainty is the rate divided by the square root of the number of escapes. The reference stays the 2012 parallel-replica rate. Seed is 20261018 plus the repetition index. Optimizer L-BFGS, max_move 0.2, max_iterations 1000, converged_force 0.001. The ranked cost is eon_dynamics_calls, the client total_force_calls summed over replicas."

[ini.Main]
job = "parallel_replica"
temperature = 250
random_seed = 1

[ini.Potential]
potential = "eam_al"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.Dynamics]
time_step = 1.0
time = 20000
thermostat = "langevin"
langevin_friction = 0.001

[ini."Parallel Replica"]
stop_after_transition = true
dephase_time = 1000
refine_transition = true
state_save_interval = 10
state_check_interval = 500
post_transition_time = 200

[ini.Communicator]
type = "local"
num_jobs = 8
jobs_per_bundle = 1
number_of_CPUs = 1
client_path = "eonclient"
