id = "eon/develop-saddle-pt-lanczos"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn"
code_version = "3.6.0"
commit = "97f593363171d94e3008ebc1e4bfd7c6033eaa85"
algorithm = "Lanczos"
note = "One displacement search on the harness counter. repetitions is 1. The harness cap is 5064, the per-search sum stored in the problem scoring note. max_searches is 20000, the count on rgsaddle/saddle-lanczos. The problem file does not set max_searches or a repetition count. The minimum mode is Lanczos, tolerance 0.001, max_iterations 20, quit_early true. Develop tip, Fortran, no source patch."

[search]
repetitions = 1
max_searches = 20000
per_search_cap = 5064

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Lanczos]
tolerance = 0.001
max_iterations = 20
quit_early = true

[ini.LBFGS]
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_auto_scale = true
