id = "eon-client/neb-pt-cg"
engine = "eon"
problem = "neb/Pt-heptamer"
code = "eOn"
code_version = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
algorithm = "CG"
reducer = "harness"
failure_cap = 10000
kind = "neb-pt"
kernel = "morse"
asv_class = "EonClientNebPtCg"
note = '''
Archive neb/Pt-heptamer/eon-cg/config.ini (eOn r2090, 3 Apr 2013). Climbing-image NEB, optimizer cg, max_move 0.2, converged_force 0.01, images 8, spring 5. CG is the 1d Newton step (cg_line_search false). r2090 convergenceForce returns only the climbing-image norm once that image is set. eOn 3.5.0 climbing_image_converged_only still requires the rest of the band inside band_slack times the tolerance (default 10). band_slack 0 restores the r2090 test. The report.sh mean divides force_calls_neb by 8. The harness kernel is morse/smooth/linear with D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, and periodic boundaries in x and y.
'''
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "norm"
converged_force = 0.01
max_move = 0.2
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 8
climbing_image_method = true
climbing_image_converged_only = true
climbing_image_band_slack = 0.0
doubly_nudged = false
doubly_nudged_switching = false
opt_method = "cg"
spring = 5.0

[ini.CG]
cg_line_search = false
