id = "eon-client/low-lj38-lanczos"
engine = "eon"
problem = "lowest-eigenvector/lj38"
code = "eOn"
code_version = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
algorithm = "Lanczos CG"
reducer = "harness"
failure_cap = 10000
kind = "lowest"
kernel = "lj40"
asv_class = "EonClientLowLj38Lanczos"
note = '''
Lowest mode with Lanczos. Tolerance 0, as in the 2014 file that left the iteration count as CHANGEME. The harness walks max_iterations from 1. Overlap target 0.99. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
overlap = 0.99
iteration_limit = 1000
seeds = [1]
asv_timeout = 1800
budget_seconds = 1200

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini."Saddle Search"]
max_iterations = 0
min_mode_method = "lanczos"
client_displace_type = "load"
