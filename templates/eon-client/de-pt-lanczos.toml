id = "eon-client/de-pt-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "eOn"
code_version = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
algorithm = "Lanczos L-BFGS"
reducer = "harness"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse"
asv_class = "EonClientDePtLanczos"
note = '''
Lanczos from the interpolated Pt-island end points. max_iterations 10, tolerance 0.05, quit_early false. max_energy 1e9. LBFGS max_iterations 1000, converged_force 0.001. The harness kernel is morse/smooth/linear with D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, and periodic boundaries in x and y.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = false
