id = "ase-3.6.0/morse-lbfgs"
engine = "ase"
code = "ASE"
code_version = "3.6.0"
commit = "r2515"
algorithm = "LBFGS"
problem = "minimization/morse-bulk"
task = "minimize"
profile = "tuned"
reducer = "capped"
ranked = true
parameter_source = "archive"
note = "Archive minimization/morse-bulk/ase-lbfgs. ASE 3.6.0 LBFGS uses memory 20, maxstep 0.2, and alpha 1/0.04, so the inverse Hessian stays 0.04. The potential is TSASE Morse on the archived POSCAR starts: D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, pair energy shifted to zero at the cutoff, orthorhombic DNINT minimum image. The count is LBFGS.force_calls, one per accepted step."

[optimizer]
name = "LBFGS"
implementation = "3.6.0"

[optimizer.parameters]
maxstep = 0.2
alpha = 25.0
memory = 20

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
rc = 9.5
form = "tsase"
pbc = [true, true, true]

[stop]
norm = "l2"
force_norm = 0.001
max_force_calls = 10000
max_steps = 10000

[input]
archive_path = "website/minimization/morse-bulk/ase-lbfgs/morse-bulk.tgz"
