id = "torchsim/morse-fire"
engine = "torchsim"
problem = "minimization/morse-bulk"
code = "TorchSim"
code_version = "0.6.2"
commit = "5540d893a849db9772081229a86d5f68537ad037"
algorithm = "FIRE"
tuning = "default"
note = "Default profile. FIRE uses the ASE flavor at the constructor defaults: dt_start 0.1, alpha_start 0.1, dt_max 1, n_min 5, f_inc 1.1, f_dec 0.5, f_alpha 0.99, max_step 0.2. SpecPotentialModel evaluates the problem potential. The orthorhombic cell stays fixed."

[torchsim]
method = "fire"
fire_flavor = "ase_fire"
dt_start = 0.1
alpha_start = 0.1
dt_max = 1.0
n_min = 5
f_inc = 1.1
f_dec = 0.5
f_alpha = 0.99
max_step = 0.2

[stop]
norm = "l2"
force_norm = 0.001
max_force_calls = 10000
