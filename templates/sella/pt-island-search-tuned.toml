id = "sella/pt-island-search-tuned"
engine = "sella"
code = "Sella"
code_version = "2.6.0"
commit = "6cfb60cdb100a146c3c6f0587d5308b247aa8010"
algorithm = "Sella"
problem = "saddle-search/pt-island"
task = "sella-search"
profile = "adjusted"
reducer = "capped"
ranked = false
parameter_source = "transferred"
note = "Archived Sella trust region: eta 1e-6, gamma 0.4, delta0 1.3e-3, rho_inc 1.035, rho_dec 5, sigma_inc 1.15, sigma_dec 0.65. Sixteen searches, each a Gaussian displacement of standard deviation 0.1 on the free atoms, then Sella order 1 with v0 unset. One search is not the saddle catalog, so this row is not ranked and fraction_connected is not reported. The cost is the per-search harness count. The potential is energy-shifted Morse at cutoff 9.5, the eOn Morse::force surface."

[optimizer]
name = "Sella"

[optimizer.parameters]
order = 1
eta = 1e-06
gamma = 0.4
rho_inc = 1.035
rho_dec = 5.0
sigma_inc = 1.15
sigma_dec = 0.65
delta0 = 0.0013

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
rc = 9.5
form = "shift"
pbc = [true, true, false]

[stop]
norm = "l2"
force_norm = 0.001
max_force_calls = 10000
max_steps = 5000

[input]
archive_path = "website/saddle-search/pt-island/pt-island.con"
select = "file"

[sella]
order = 1
v0 = "none"

[sella_search]
searches = 16
gauss_std = 0.1
