note = "Sella 2.6.0 order 1 defaults refine the highest-energy image after the ASE default band (FIRE, spring 0.1, climb off, linear interpolation). The band runs at ASE stock defaults until the NEB residual reaches ASE's stock fmax or the highest-energy image's true-force L2 norm is at most 0.001. Sella then refines that image at order-1 defaults until the same L2 stop or the shared cap of 250000 force calls. v0 is unset: a free cluster drops rigid modes, so a full Cartesian mode has the wrong length. ASE NEB defaults on the same pairs: spring 0.1, climb off, FIRE. The harness stops when the L2 norm of the true force on the highest-energy image is at most 0.001, or at the problem cap of 250000 force calls. archive/entries/double-ended-saddle-search/lj38_2ts_separation/pele/benchmark.dat records an observed maximum of 114490 force calls, and the archive ran uncapped."

