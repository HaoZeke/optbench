id = "sella/de-lj38-tuned"
engine = "sella"
code = "Sella"
code_version = "2.6.0"
commit = "6cfb60cdb100a146c3c6f0587d5308b247aa8010"
algorithm = "Sella+NEB"
problem = "double-ended-saddle-search/lj38"
task = "sella-neb"
profile = "adjusted"
reducer = "capped"
ranked = true
parameter_source = "repaired"
note = "Sella refines the highest-energy image of this problem's tuned ASE band. Archived Sella trust region: eta 1e-6, gamma 0.4, delta0 1.3e-3, rho_inc 1.035, rho_dec 5, sigma_inc 1.15, sigma_dec 0.65. The band stops at 80 percent of the call cap and both stages share one harness counter. v0 is unset: a free cluster drops rigid modes, so a full Cartesian mode has the wrong length. The previous ASE campaign, results/campaign/ase-3.29.0-de-lj38-tuned.dat, failed all 50 pairs at the 2500 cap with LBFGS maxstep 0.05 and climb from the first step. This row keeps 5 images, spring 5, and the 2500 eOn exclusion. Interpolation is IDPP. LBFGS maxstep is 0.01 and damping is 0.2. Climb stays off until the maximum residual is at or below 0.4."

[optimizer]
name = "Sella"

[optimizer.parameters]
order = 1
eta = 1e-06
gamma = 0.4
rho_inc = 1.035
rho_dec = 5.0
sigma_inc = 1.15
sigma_dec = 0.65
delta0 = 0.0013

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
rc = 40.0
pbc = [false, false, false]

[stop]
norm = "fmax"
gradient_norm = 0.001
force_norm = 0.001
max_force_calls = 2500
max_steps = 1000

[input]
archive_path = "website/double-ended-saddle-search/lj38/coords-con.tgz"

[neb]
layout = "indexed"
moving_images = 5
spring = 5.0
climb = false
method = "improvedtangent"
interpolate = "idpp"
climb_after = 0.4
count = 50
band_optimizer = "LBFGS"

[neb.band_parameters]
maxstep = 0.01
damping = 0.2

[sella]
order = 1
v0 = "none"
reserve = 0.2
