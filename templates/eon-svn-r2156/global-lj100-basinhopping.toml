note = '''
Archived globalopt/lj100-binary/eon-basinhopping config.ini. A later duplicate key replaces the earlier one. potential is lammps. The pair style is the archived in.lammps, not an ext_pot harness. report.sh writes min, max, and average energy. It does not write force calls. The client pin is r2156. The archived-versus-rerun table is docs/eon-svn-paper.md.
'''

[ini.Main]
job = "basin_hopping"
quiet = true
write_log = false
temperature = 14000

[ini.Potential]
potential = "lammps"
