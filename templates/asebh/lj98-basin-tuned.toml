note = "Temperature 8000 K, displacement 0.5, and the LBFGS force stop 0.001 are the Lennard-Jones 38 eOn archive. This problem has no basin-hopping config of its own. ASE stores the temperature as kT = 8000 * kB and does not adjust the step size. The local iteration bound is 1000, the archived max_iterations. Seed 314159 is the archived random_seed, reused for every start. The problem file caps a start at 2000000 force calls."

[method]
