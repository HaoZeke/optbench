# LAMMPS 30 Sep 2026 fix neb. The second stage climbs.
# examples/neb/README: more than four replicas for a precise barrier. This row uses five.
# The neb command doc asks for a timestep about ten times a dynamics timestep.
# N1 and N2 are the largest pair whose max-iteration pair computes reach the cap.
id = "lammpsneb/ci-fire-tuned"
engine = "lammps-neb"
code = "LAMMPS"
code_version = "30 Sep 2026"
commit = "8de817dd79bfe4525d5d39246a212d833e6dee07"
algorithm = "CI-NEB-fire"
tuning = "tuned"

[band]
climbing = true
min_style = "fire"
spring_k = 1.0
parallel = "neigh"
call_reserve = 0.0
replicas = 5
timestep_scale = 10.0
step_budget = "cap"
