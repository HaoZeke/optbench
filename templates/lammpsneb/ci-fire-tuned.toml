# LAMMPS 30 Sep 2026 fix neb. The second stage climbs.
# Five-start calibration, declared and not scored: unit timestep,
# the problem image count, and a 1:2 split of the default FIRE budget.
# N1 is one third of that total and N2 is the rest.
id = "lammpsneb/ci-fire-tuned"
engine = "lammps-neb"
code = "LAMMPS"
code_version = "30 Sep 2026"
commit = "8de817dd79bfe4525d5d39246a212d833e6dee07"
algorithm = "CI-NEB-fire"
tuning = "tuned"

[band]
climbing = true
min_style = "fire"
spring_k = 1.0
parallel = "neigh"
# FIRE evaluates the pair style again when it resets velocities.
# The reserve is the same one the default row uses.
call_reserve = 0.2
step_budget = "climb"
