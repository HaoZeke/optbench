# LAMMPS 30 Sep 2026 fix neb. The second stage climbs.
# The problem file supplies the image count, the cap, the force norm, and max_move.
# Kspring is 1.0 with the parallel neigh spring. min_style is fire.
# The timestep is the unit default. FIRE velocity resets add pair computes.
id = "lammpsneb/ci-fire"
engine = "lammps-neb"
code = "LAMMPS"
code_version = "30 Sep 2026"
commit = "8de817dd79bfe4525d5d39246a212d833e6dee07"
algorithm = "CI-NEB-fire"
tuning = "default"

[band]
climbing = true
min_style = "fire"
spring_k = 1.0
parallel = "neigh"
# FIRE evaluates the pair style again when it resets velocities.
# The reserve keeps those computes inside the problem cap.
call_reserve = 0.2
