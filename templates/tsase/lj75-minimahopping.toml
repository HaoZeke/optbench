note = "Library constructor of tsase.optimize.minimahopping.MinimaHopping. T0 is 1000 K, Ediff0 is 0.5, mdmin is 2, the timestep is 0.1 fs, fmax is 0.05, and the local optimizer is QuasiNewton, which is ASE 3.29 BFGSLineSearch. The dimer and the energy comparison use the harness potential. The search stops at the Cambridge N=75 minimum plus 0.001, or at 2000000 force calls. That cap is problems/globalopt/lj75.toml convergence.max_force_calls. Stock BFGSLineSearch clamps the first trial on an overlapped archive start. Reading forces again at that trial is a cache hit, not a force call. While the line-search bracket is set, a repeated step is the library rounding-error test: the test warns and the quench continues. On the stalled starts the bracket stays unset, so that test does not run and the same step is proposed again. The harness records that fixed point as stalled. Each start is one process with seed 314159."

[tsase]
method = "minima_hopping"
seed = 314159

[stop]
max_force_calls = 2000000
