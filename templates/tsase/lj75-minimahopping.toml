note = "Library constructor of tsase.optimize.minimahopping.MinimaHopping. T0 is 1000 K, Ediff0 is 0.5, mdmin is 2, the timestep is 0.1 fs, fmax is 0.05, and the local optimizer is QuasiNewton, which is ASE 3.29 BFGSLineSearch. The dimer and the energy comparison use the harness potential. The search stops at the Cambridge N=75 minimum plus 0.001, or at 1000000 force calls. That cap is problems/globalopt/lj75.toml convergence.max_force_calls, above the archived GMIN maximum of 310110. Stock BFGSLineSearch stalls on overlapped archive starts: the line search repeats one clamped step, and the harness records that start as stalled and charges PAR-2. This run recorded 189 stalled starts and 11 starts at the 1000000-call cap, with no success. ASE basin hopping, TSASE basin hopping, and the archived GMIN row quench the same starts. eOn has no lj75 row. Each start is one process with seed 314159."

[tsase]
