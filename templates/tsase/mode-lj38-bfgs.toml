# TSASE dimer rotation with the BFGS rotation optimiser.
id = "tsase/mode-lj38-bfgs"
engine = "tsase"
problem = "lowest-eigenvector/lj38"
code = "TSASE"
code_version = "1.0 (98aac60)"
commit = "98aac60b5d9905e81ee4e6b8c385f169258d0218"
algorithm = "SSDimer BFGS"
tuning = "default"
note = "SSDimer rotationOpt is bfgs. rotationMax is the 10000-call cap. maxStep, dR, and phi_tol stay at the constructor defaults. SSDimer.search owns translation and rotation. The problem stops at absolute overlap 0.99 or the call cap."

[tsase]
method = "dimer"
rotation_opt = "bfgs"
max_step = 0.2
dr = 0.001
phi_tol = 5.0
rotation_max = 10000
