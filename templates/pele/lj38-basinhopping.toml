note = "Basin hopping from bin/js850/globalopt.py. Temperature 1, RandomDisplacement 0.41, AdaptiveStepsize acceptance 0.5, factor 0.9, interval 100. The quench is lbfgs_cpp with RMS tolerance 1e-3, memory 4, and maxstep 0.1. pele 0.1.2 multiplies a rising LBFGS step by 1/2. codes/pele-a68ec5-lbfgs-linesearch.patch restores the a68ec5 division by 10. The potential is the harness Lennard-Jones kernel, epsilon 1, sigma 1, cutoff 40, no shift. The stop is the Markov energy at most -173.9284 + 1e-3. A force call is one getEnergy or getEnergyGradient. The seed is the integer in the start name. The budget is 4000000, above the archived maximum."

