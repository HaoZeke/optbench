id = "pele/lj38-basinhopping"
engine = "pele"
problem = "globalopt/lj38"
code = "pele"
code_version = "0.1.2"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
algorithm = "basin hopping"
tuning = "default"
note = "Basin hopping with pele.optimize.lbfgs_cpp and pele.basinhopping.BasinHopping. Temperature is 1.0 and the initial step size is 0.6, the LJCluster defaults, inside AdaptiveStepsizeTemperature. The potential is the harness Lennard-Jones kernel, epsilon 1, sigma 1, cutoff 40, no shift. The minimum is the Cambridge cluster database pair-well depth. The force-call cap is 2000000. The seed is the integer in the start name."

[pele]
temperature = 1.0
stepsize = 0.6
quench = "lbfgs_cpp"
quench_tol = 1.0e-5
quench_maxstep = 0.1
quench_m = 4
quench_nsteps = 10000
target_new_min_prob = 0.8
target_new_min_accept_prob = 0.3
interval = 100
tfactor = 0.95
sfactor = 0.95
ediff = 0.001

[reference]
energy_minimum = -173.928427
energy_above_minimum = 0.001
source = "Cambridge cluster database, pair well depth"

[stop]
max_force_calls = 2000000

[input]
archive_path = "website/globalopt/lj38/100_lj38.tar.gz"
