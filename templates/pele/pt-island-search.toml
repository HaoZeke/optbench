id = "pele/pt-island-search"
engine = "pele"
code = "pele"
code_version = "0.1.2"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
algorithm = "hybrid eigenvector following"
problem = "saddle-search/pt-island"
task = "saddle-search"
tuning = "default"
note = "Hybrid eigenvector following on single-atom displacements of the minimized Pt island. Library quench controls, with the iteration limit above the climb cap. The climb cap is 1000 force calls. Each endpoint minimization has a budget of 2000. The PAR-2 cap is 5064."

[stop]
force_norm = 0.001

[ini.Optimizer]
max_iterations = 1000
converged_force = 0.001
max_move = 0.2

[hef]
nsteps = 10000
nfail_max = 200
nsteps_tangent1 = 10
nsteps_tangent2 = 100
max_uphill_step = 0.5
max_uphill_step_initial = 0.2
demand_initial_negative_vec = false
check_negative = true
index_seed = 0
orthog = "none"
eigenvec0 = "kick"

[search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
rmsd_connect = 0.5
max_searches = 20000
connected = 27
barrier_eV = 1.5
endpoint_budget = 2000
climb_overshoot = 64
minimize_budget = 5000
