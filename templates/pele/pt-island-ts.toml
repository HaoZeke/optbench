id = "pele/pt-island-ts"
engine = "pele"
code = "pele"
code_version = "0.1.2"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
algorithm = "hybrid eigenvector following"
problem = "tsopt/pt-island"
task = "transition-state"
tuning = "default"
note = "Library FindTransitionState on the free atoms. orthogZeroEigs is unset because the substrate fixes the frame. The initial eigenvector is the free displacement from the reactant. A converged candidate also pays for the transverse mode screen."

[stop]
force_norm = 0.001
max_force_calls = 10000

[hef]
nsteps = 100
nfail_max = 200
nsteps_tangent1 = 10
nsteps_tangent2 = 100
max_uphill_step = 0.5
max_uphill_step_initial = 0.2
demand_initial_negative_vec = false
check_negative = true
index_seed = 0
orthog = "none"
eigenvec0 = "reactant"
