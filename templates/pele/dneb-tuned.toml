# pele 0.1.2 climbing-image DNEB. The same setting set as pele/neb-tuned.
# The band runs until the true force on the highest image meets the problem norm.
# Spring 100 is the default of pele.transition_states.NEB, and it lies in the
# L-BFGS window of Trygubenko and Wales, J. Chem. Phys. 120, 2082 (2004), section III.3.
# That section uses memory 4 and an initial inverse-Hessian diagonal of 0.1.
# maxErise 1 is the mylbfgs value named in NEB.optimize.
# Doubly nudged springs are the DNEB gradient of that paper.
# MakeHighestImageClimbing applies the climbing-image force of Henkelman, Uberuaga,
# and Jonsson, J. Chem. Phys. 113, 9901 (2000).
# The problem file supplies the image count, the cap, the max move, and the force norm.
id = "pele/dneb-tuned"
engine = "pele-band"
code = "pele"
code_version = "0.1.2"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
algorithm = "CI-DNEB"
tuning = "tuned"

[ini]

[band]
kind = "dneb"
dneb = true
climbing = true
stop = "true_force"
spring_k = 100.0
max_erise = 1.0
memory = 4
h0 = 0.1
neb_tol = 1e-4
niter = 1
iter_density = 10.0
quench_tol = 0.01
