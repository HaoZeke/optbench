# pele a68ec5 double-ended LJ38, the 2014 optbench.org driver dec_lj38.py.
# One local connect: DNEB at image_density 4, then hybrid eigenvector following
# from the highest-energy image. The tangent guess is the NEB tangent.
# The potential is unshifted LJ. PotWrapperIncr counts getEnergy and
# getEnergyGradient. findTransitionState success keeps the total. A failed
# search is left out of the mean. The RMS stop is 1e-3/sqrt(3*natoms), the
# problem Euclidean norm 0.001. natoms is 38.
id = "pele/de-lj38"
engine = "pele-a68ec5"
code = "pele"
code_version = "a68ec5"
commit = "a68ec5e7706a64b93a85ac34ffe22cd08eb1c1c9"
algorithm = "hybrid eigenvector following"
problem = "double-ended-saddle-search/lj38"
tuning = "archive"

[neb]
image_density = 4.0
iter_density = 20.0
reinterpolate = 50
adjustk_freq = 50
k = 1.5
quench_tol = 0.1
dneb = true

[ts]
eigenvector = "forward"
lowest_eigenvector_nsteps = 20
lowest_eigenvector_tol = 0.1
nsteps_tangent1 = 3
nsteps_tangent2 = 35
max_uphill_step = 0.4
tangent_maxstep = 0.05
