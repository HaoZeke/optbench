# pele 0.1.2 NEB, then hybrid eigenvector following.
# One setting set for every start.
# The band is the problem image count on the linear interpolant. It stops at
# rms 0.01 or after iter_density steps per image, the first NEB pass in
# pele.landscape.LocalConnect. The problem cap counts every potential call.
# One band gradient evaluates every interior image, and the refinement spends
# the remaining calls on one image.
# Spring 100, memory 4, and an initial inverse-Hessian diagonal of 0.1 are the
# L-BFGS window in Trygubenko and Wales, J. Chem. Phys. 120, 2082 (2004),
# section III.3.
# maxErise 100 is the value NEB.optimize names for this non-Hamiltonian band
# gradient, and the value the stock band already uses.
# Climbing stays off. On a two-saddle LJ38 start the climbing stage left the
# true force where the band had stopped while eigenvector following from that
# image met the force norm.
# The problem file supplies the image count, the cap, the max move, and the force norm.
id = "pele/neb-tuned"
engine = "pele-band"
code = "pele"
code_version = "0.1.2"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
algorithm = "NEB+EF"
tuning = "tuned"

[ini]

[band]
kind = "neb"
dneb = false
climbing = false
stop = "true_force"
spring_k = 100.0
max_erise = 100.0
memory = 4
h0 = 0.1
neb_tol = 1e-4
niter = 1
iter_density = 10.0
quench_tol = 0.01
