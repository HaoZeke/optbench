# GPR calculator 0.0.4. Climbing-image GP-NEB. Force noise is the problem
# force stop. Energy noise is that stop per atom, with the 0.0002 floor
# from examples/Pd4/gp_neb.py. The optimizer is BFGS and the step limit is 100.
id = "gprcalc/gp-ci-neb"
engine = "gprcalc"
code = "GPR calculator"
code_version = "0.0.4"
commit = "c4d63271a6e87a14171ed43fe85a56b38ee1bea1"
algorithm = "GP-CI-NEB"
tuning = "tuned"

[ini]

[band]
climbing = true
algo = "BFGS"
spring_k = 0.1
steps = 100
kernel = "RBF"
zeta = 2.0
noise_mode = "force-stop"
noise_e_floor = 0.0002
lmax = 4
nmax = 3
rcut = 5.0
freq = 10
neb_method = "improvedtangent"
