note = "Default fixed-composition search. The composition is C and both atom limits are 38, because the archive holds 38-atom clusters and GASP reduces a formula to one atom. The archived geometry is the file organism, and 27 random organisms make the default initial population of 28. Pool size, variation fractions, the redundancy guard, and the 800-calculation stop are the fixed-composition defaults. The search also stops at 0.001 above the problem reference, the Cambridge Cluster Database value -173.928427. A LAMMPS 8de817dd quench of the Wales coordinates with pair_style lj/cut 40, pair_coeff * * 1 1, units lj, and thermo_modify norm no gives -173.928426590629. Each calculation is minimize cg to a force tolerance of 1e-8 and at most 20000 force evaluations, then run 0 for the dump. The problem states no force cap, so the failure cap is one above 800 times 20001 and a finished calculation budget stays under it. The seed is 20261015 plus the start index. This revision runs with shims for PyYAML, Structure.modify_lattice, species_and_occu, Structure.to, Lattice.from_lengths_and_angles, and PeriodicSite equality. MoleculeMatcher.fit keeps the InChI of a geometry and returns false when the two InChI strings differ; a matching InChI still uses the original RMSD test."

