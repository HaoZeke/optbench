note = "Default fixed-composition search. The composition is C and both atom limits are 75, because the archive holds 75-atom clusters and GASP reduces a formula to one atom. Each coords.N file is the file organism, and 27 random organisms make the default initial population of 28. Pool size, variation fractions, the redundancy guard, and the 800-calculation stop are the fixed-composition defaults. The problem file states no energy minimum, so each search runs the calculation budget and the row keeps the lowest extensive energy and the harness calls. Each calculation is minimize cg to a force tolerance of 1e-8 and at most 20000 force evaluations, then run 0 for the dump. The force cap is one above 800 times 20001. The seed is 20261015 plus the sorted start index. Lennard-Jones relaxation uses LAMMPS pair_style lj/cut, cutoff 40, epsilon 1, sigma 1, units lj, and thermo_modify norm no."

