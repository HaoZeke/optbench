id = "eon-svn/de-pt-lanczos-current"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "Eon svn current"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos L-BFGS current SVN"
reducer = "archive"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse_shift"
native_potential = true
asv_class = "EonSvnDePtLanczosCurrent"
note = '''
Current-SVN row for stock r2549 Lanczos on the Pt island. The binary is unmodified r2549, built with Fortran, using that revision's Morse potential. finite_difference is 0.01, the r2549 default, and the other optimizer keys are the r2549 defaults. The score is the client's total_force_calls. report.sh keeps totals under 3000 in the mean and counts a termination reason other than 0 as nfailed. This run is 233 calls and 0 failures. It is not the 2014 paper baseline. That row is eon-svn/de-pt-lanczos on unmodified r2156.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.01
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = false
