id = "eon-svn/htst-pt-quench-stock"
engine = "eon"
problem = "hTST/Pt"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer QM"
reducer = "harness"
kind = "htst"
kernel = "morse_shift"
tuning = "stock"
note = '''
Stock EON SVN r2549 dimer on the quench_dimer-qm reactant. Temperature 700, seed 42, confidence 1.1, prefactor 1.2e12, optimizer qm, converged_force 0.001, max_iterations 5000, time_step 0.3, minimize_first false, displace_least_coordinated_weight 1, radius 3.3, magnitude 0.3, max_energy 10, dimer rotations_max 100, converged_angle 5. The archive communicator buffer is 1000 jobs on 2 CPUs. This score used local batches of 8 and the seed-42 displacement sequence. The harness potential is morse_shift. The ranked cost is the PotServer total at the stop. Sad-fcs in per-batch job-id order are stored beside that total.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/quench_dimer-qm/states/0/reactant.con"
pass_limit = 1
workers = 8
asv_full = false
budget_seconds = 7200

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1.2e12"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000
opt_method = "qm"
time_step = 0.3

[ini.AKMC]
confidence = 1.1

[ini."Process Search"]
minimize_first = false

[ini.Communicator]
type = "local"
client_path = "eonclient"
number_of_CPUs = 8
num_jobs = 8

[ini."Saddle Search"]
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 10.0

[ini.Dimer]
rotations_max = 100
converged_angle = 5.0
