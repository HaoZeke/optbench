id = "eon-svn/htst-pt-lanczos-cg2"
engine = "eon"
problem = "hTST/Pt"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos-CG rotation: max=50, tol=0.05"
reducer = "harness-htst"
pass_limit = 8000
note = "EON (SVN r2549), the SVN code at r2549, stock. morse_pt is the C++ Morse potential in that binary: D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, pair energy shifted to zero at the cutoff. The ini is the archived keys only: temperature 700 K, seed 42, confidence 1.9, Lanczos tolerance 0.05, max_iterations 50, conjugate-gradient climb at the r2549 default, converged_force 0.001, max_iterations 5000, least-coordinated displacement weight 1, radius 3.3, magnitude 0.3, prefactor 1.2e12. finite_difference, convergence_metric, thermally_accessible_window, and quit_early stay at the r2549 defaults (0.01, norm, 20, true). A start is one barrier window. Communicator num_jobs 32."

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
max_energy = 1000.0

[ini.Prefactor]
default_value = 1.2e12

[ini.Lanczos]
tolerance = 0.05
max_iterations = 50
