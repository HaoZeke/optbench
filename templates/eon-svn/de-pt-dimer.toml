id = "eon-svn/de-pt-dimer"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse_shift"
asv_class = "EonSvnDePtDimer"
note = '''
Min-mode dimer from the interpolated Pt-island end points. Dimer converged_angle 5, rotations_max 10, improved true. max_energy 1e9. LBFGS max_iterations 1000, converged_force 0.001. The harness kernel is r2549 Morse::force: cutoff 9.5, pair energy shifted to zero at the cutoff, minimum image on the box diagonal. D 0.7102, alpha 1.6047, r0 2.897.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Dimer]
opt_method = "cg"
improved = true
converged_angle = 5
rotations_max = 10
rotations_min = 1
