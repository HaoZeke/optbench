id = "eon-svn/pt-island-stock"
engine = "eon"
problem = "saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
tuning = "default"
failure_cap = 100000000
pass_limit = 100000000
note = "Dimer AKMC on the Pt island. Optimizer opt_method is cg, Dimer rotations_max is 20, and Saddle Search bowl_breakout is true with bowl_active_atoms 20. confine_positive is true because this client reads bowl_breakout only when that switch is on. Everything else is an r2549 default, except converged_force 0.001, which is the problem norm, and confidence 1.1, which holds the search on the initial state so the run can reach 27 good saddles below 1.5 eV. Optimizer max_iterations, Saddle Search max_iterations, and pass_limit are 100000000, the campaign force-call cap, so a search count, an iteration count, or a step count does not end the run before that cap. There is no wall-clock limit. The harness kernel is the problem Morse. Seed 1000, 4 workers."

[ini.Main]
job = "akmc"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "cg"
converged_force = 0.001
max_iterations = 100000000

[ini.Dimer]
rotations_max = 20

[ini.AKMC]
confidence = 1.1

[ini."Saddle Search"]
converged_force = 0.001
max_iterations = 100000000
confine_positive = true
bowl_breakout = true
bowl_active_atoms = 20
