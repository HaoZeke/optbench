id = "eon-svn/pt-island-stock"
engine = "eon"
problem = "saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
tuning = "default"
failure_cap = 100000000
pass_limit = 100000000
note = "Dimer AKMC on the Pt island. AKMC and saddle settings come from the stored deck eon_r2213_cg_bowl_breakout_20.tgz, inner file eon_r2213_cg_confine_20_1/config.ini. Main temperature is 700. AKMC confidence is 1.1 and thermally_accessible_window is 99999. That file does not set thermally_accessible_buffer. Saddle Search uses this client's names displace_listed_atom_weight 1 and displace_atom_list 0,1,2,3,4,5,6 for the deck keys displace_listed_weight and displace_atomlist, plus displace_all_listed false, displace_radius 3.3, displace_magnitude 0.1, min_mode_method dimer, max_energy 5, max_iterations 1000, confine_positive true, bowl_breakout true, and confine_positive_min_active 20. The deck does not set bowl_active_atoms. Optimizer opt_method is cg, max_move 0.2, max_iterations 1000, converged_force 0.001. Dimer rotations_max is 20 and converged_angle is 5. Prefactor default_value is 5e12. Process Search minimize_first is true. The run ends when 27 good saddles are below 1.5 eV or the harness reaches 100000000 force calls. Seed 1000, 4 workers. The harness kernel is the problem Morse."

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "cg"
converged_force = 0.001
max_iterations = 1000
max_move = 0.2

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini."Saddle Search"]
converged_force = 0.001
max_iterations = 1000
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_all_listed = false
displace_radius = 3.3
displace_atom_list = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
max_energy = 5.0
confine_positive = true
bowl_breakout = true
confine_positive_min_active = 20

[ini.Prefactor]
default_value = 5e12
