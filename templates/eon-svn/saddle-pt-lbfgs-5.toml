id = "eon-svn/saddle-pt-lbfgs-5"
engine = "eon"
problem = "saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
failure_cap = 100000000
tuning = "default"
kind = "akmc"
kernel = "morse"
asv_class = "EonSvnSaddlePtLbfgs5"
asv_full = false
asv_timeout = 7200
seeds = [1, 2, 3, 4, 5, 6, 7, 8, 9]
starts = ["pt-island"]
pass_limit = 5000
workers = 4
note = """Stock SVN r2549 AKMC on the Pt island. The 2014 archive row stays the archived number. This run is the SVN code at r2549, Fortran build, algorithm unpatched, labelled EON (SVN r2549). It is not the git eOn code. Optimizer L-BFGS, dimer rotations_max 5, converged_force 0.001, max_energy 5, temperature 700, confidence 1.1, thermally_accessible_window 99999, prefactor 5e12, displacement of atoms 0-6 at radius 3.3 and magnitude 0.1. Dimer improved and the rotation optimizer stay at the r2549 defaults. The harness kernel is morse/smooth/linear, cutoff 9.5, periodic in x and y. Seeds 1 through 9, the pt-island start. The pass limit is only a ceiling. The stop is 27 good saddles below 1.5 eV. Each ranked cost is that campaign's harness force-call total."""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_all_listed = false
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Dimer]
rotations_max = 5
converged_angle = 5.0
