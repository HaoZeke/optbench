id = "eon-svn/de-2ts-ci"
engine = "eon-client"
problem = "double-ended-saddle-search/lj38_2ts_separation"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "CI-NEB"
reducer = "harness"
failure_cap = 250000
tuning = "default"
note = """Climbing-image NEB on all 51 pairs. Five images, spring 5, L-BFGS memory 20, max_move 0.05, converged_force 0.001, max_iterations 250000. failure_cap is the problem cap, 250000. Main random_seed is 1. convergence_metric norm is the Euclidean force norm. r2549 reads L-BFGS from [Optimizer]: memory, inverse curvature, max inverse curvature, auto scale, and the two resets. The run swaps the named potential for ext_pot. The kernel is lj_cut, unshifted Lennard-Jones, epsilon 1, sigma 1, cutoff 40. The binary is SVN r2549 with the Fortran potentials linked."""


[ini.Main]
job = "nudged_elastic_band"
random_seed = 1

[ini.Potential]
potential = "lj_cut"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.05
max_iterations = 250000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true

[ini."Nudged Elastic Band"]
images = 5
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
old_tangent = false
doubly_nudged = false
doubly_nudged_switching = false
converged_force = 0.001
max_iterations = 250000
