id = "eon-svn/de-lj38-dimer"
engine = "eon"
problem = "double-ended-saddle-search/lj38"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 2500
kind = "de-lj38-mode"
kernel = "lj40"
asv_class = "EonSvnDeLj38Dimer"
note = '''
EON, the SVN code, at r2549. Fortran linked and unpatched. This is not eOn. Min-mode dimer from the interpolated end points of the 50 LJ38 pairs. The ini is the archive config and nothing else: L-BFGS, converged_force 0.001, max_iterations 1000, dimer converged_angle 5, rotations_max 10, max_energy 1e9. Unset keys stay at the r2549 defaults. The archived force_calls 337 is the paper row. This stock run scores force_calls 375 (min 92, median 213.5, max 2096, nfailed 0). The gap is a finding and was not tuned closed.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Saddle Search"]
max_iterations = 1000
min_mode_method = "dimer"
max_energy = 1000000000

[ini.Dimer]
converged_angle = 5.0
rotations_max = 10
