id = "eon-svn/de-lj38-dimer"
engine = "eon"
problem = "double-ended-saddle-search/lj38"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 2500
kind = "de-lj38-mode"
kernel = "lj40"
asv_class = "EonSvnDeLj38Dimer"
note = '''
Min-mode dimer from the interpolated end points of the 50 LJ38 pairs. pos.con is the reactant. displacement.con is the reactant plus half the minimum-image product difference. direction.dat is that difference, normalized. max_energy 1e9. Dimer converged_angle 5, rotations_max 10. The 2014 ini leaves improved unset, and this template does too. LBFGS max_iterations 1000, converged_force 0.001. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Dimer]
opt_method = "cg"
converged_angle = 5
rotations_max = 10
rotations_min = 1
