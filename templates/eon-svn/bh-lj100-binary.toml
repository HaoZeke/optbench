id = "eon-svn/bh-lj100-binary"
engine = "eon"
problem = "globalopt/lj100-binary"
code = "Eon"
code_version = "r2156"
commit = "r2156"
algorithm = "Basin hopping"
reducer = "report-window"
failure_cap = 2000000
note = '''
Binary Lennard-Jones 100 basin hopping at eOn r2156. Temperature 14000, steps 60000, displacement 0.5, gaussian displacements, significant_structure true, swap_probability 0, adjust_displacement true, adjust_period 10, adjust_fraction 0.05, target_ratio 0.5, push_apart_distance 0.4. The archived config.ini sets max_displacement 0.3. r2156 reads displacement and leaves that key unread, so the displacement is the code default 0.5. LBFGS uses the norm of the force, tolerance 0.001, max_iterations 10000, memory 20, and max_move 0.2. The potential is the archived in.lammps lj/cut 20: epsilon 1, sigma 1.3 and 1.0 on the two con components in file order, cross sigma 1.15, with no shift and no tail. report.sh keeps the accepted energy on bh.dat lines whose force-call total is at most 2000000, then reports the minimum, maximum, and mean of those 100 window minima. Seeds are 2156000 plus the start index. The archive left random_seed unset, so those runs drew time(NULL).
'''

[ini.Main]
job = "basin_hopping"
temperature = 14000
quiet = true

[ini.Potential]
potential = "lammps"
lammps_logging = false

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 10000
lbfgs_memory = 20

[ini."Basin Hopping"]
steps = 60000
displacement = 0.5
displacement_distribution = "gaussian"
significant_structure = true
swap_probability = 0.0
adjust_displacement = true
adjust_period = 10
adjust_fraction = 0.05
target_ratio = 0.5
push_apart_distance = 0.4
