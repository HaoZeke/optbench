id = "eon-svn/saddle-pt-paper-dimer"
engine = "eon"
problem = "saddle-search/pt-island"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "akmc-until-27"
tuning = "default"
note = """
The archived eon-dimer config.ini, on the r2549 client. Export of r2205 is forbidden. The binary is the registry pin and it is not a NO_FORTRAN build. potential morse_pt is Morse::force. The 2014 keys displace_listed_weight, displace_atomlist, and number_of_cpus are the r2549 names displace_listed_atom_weight, displace_atom_list, and number_of_CPUs. The ini does not set Dimer improved or Dimer opt_method. On 8dc9bf61 (15 Jul 2014) and on r2549 those defaults are improved true and rotation conjugate gradient. rotations_max is 20. The stop is done.py: 27 good saddles with barrier strictly below 1.5 eV. There is no pass limit and no wall-clock budget. The server builds each displacement. Seeds are 1000 through 1009. The archived ini leaves random_seed unset, which is the clock. Ten distinct seeds are the ten run directories.
"""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 8
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_all_listed = false
displace_radius = 3.3
displace_atom_list = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.Prefactor]
default_value = 5e12
