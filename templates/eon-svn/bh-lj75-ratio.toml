id = "eon-svn/bh-lj75-ratio"
engine = "eon"
problem = "globalopt/lj75"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Basin hopping"
reducer = "harness"
failure_cap = 1000000
kind = "basin"
kernel = "lj40"
cambridge = true
cache_token = "cambridge-1-ratio-0.5"
tuning = "target-ratio-0.5"
label = "target_ratio 0.5"
asv_class = "EonSvnBhLj75Ratio"
note = """
Basin hopping with target_ratio 0.5. Temperature stays 8000, random_seed 314159, displacement 0.5, adjust_displacement true, steps 10000000, and the LBFGS block is unchanged. r2549 Parameters.cpp and develop basin_hopping_options_t default target_ratio to 0.5. The eOn basin-hopping page (https://henkelmanlab.org/eon/basin_hopping.html) uses that default and cites Wales and Doye, J. Phys. Chem. A 101, 5111 (1997). The LJ38 entry overrides it to 0.3. On lj75 that override stays in the -396.28 basin until the 1000000-call cap, so this row restores the documented acceptance target and changes nothing else. stop_energy is the Cambridge minimum plus 0.001. Success is the harness Cambridge rule. There is no wall-clock budget.
"""
seeds = [314159]
asv_full = false
asv_timeout = 7200

[input]
archive_path = "website/globalopt/lj75/lj75_clusters.tgz"
select = "coords"

[ini.Main]
job = "basin_hopping"
temperature = 8000
random_seed = 314159
finite_difference = 0.001

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Basin Hopping"]
steps = 10000000
displacement = 0.5
adjust_displacement = true
target_ratio = 0.5
stop_energy = "-397.491331"
