id = "eon-svn/htst-pt-dimer-cg2"
engine = "eon"
problem = "hTST/Pt"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer-CG rotation: max=50, tol=1"
reducer = "harness-htst"
pass_limit = 4000
window_target = 13
geometry = "website/hTST/Pt/eon-dimer-cg2/pos.con"
note = "AKMC on the Pt island with the r2549 client. morse_pt is the C++ Morse potential in that binary. Temperature 700 K, seed 42, confidence 1.9, confidence_scheme old. thermally_accessible_window is 22 so a 1.207 eV barrier stays inside the table at 700 K. Dimer rotation is conjugate gradient. improved is true. rotations_max 50, converged_angle 1. Displacement is the least coordinated atom, weight 1, radius 3.3, magnitude 0.3. Optimizer and saddle converged_force are 0.001 with convergence_metric max_atom, max_iterations 5000, saddle max_energy 1000. Prefactor default_value is 1.2e12. A start is one barrier window from optbench.htst. The archived mean is over 9 barrier windows. This run collects 13, the same window count as the max=10 row. The rotation step is the r2006 ImprovedDimer update: thetaOld is stored after normalization and mixed as thetaOld times the previous rotational-force norm, and the trial dimer is placed before the tangent is renormalized. r2222 stores the unnormalized direction and drops that norm; with rotations_max 50 that later update closes the barrier set in about half the archived searches."

[htst]
temperature = 700
rate_ref = 155055901.244
rate_accuracy = 0.999
prefactor = 1.2e12
kb = 8.6173324e-5
barrier_ceiling = 1.3
barriers = [0.601, 0.601, 0.620, 0.986, 0.987, 0.989, 0.986, 0.987, 0.989, 1.196, 1.196, 1.196, 1.196, 1.207, 1.207]

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "max_atom"
converged_force = 0.001
max_move = 0.2
max_iterations = 5000

[ini.AKMC]
confidence = 1.9
confidence_scheme = "old"
thermally_accessible_window = 22

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
max_energy = 1000.0
max_iterations = 5000
converged_force = 0.001

[ini.Prefactor]
default_value = 1.2e12

[ini.Dimer]
improved = true
opt_method = "cg"
converged_angle = 1.0
rotations_max = 50
rotations_min = 1
finite_angle = 0.005
