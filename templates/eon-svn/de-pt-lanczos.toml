id = "eon-svn/de-pt-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos L-BFGS"
reducer = "archive"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse_shift"
native_potential = true
asv_class = "EonSvnDePtLanczos"
note = '''
Lanczos from the interpolated Pt-island end points. The 29 Aug 2013 ini sets max_iterations 10, tolerance 0.05, quit_early false, and leaves finite_difference unset. The r2549 default is 0.01, so that key is 0.01 here. The score is the client's total_force_calls on morse_pt. report.sh keeps totals under 3000 in the mean and counts termination_reason other than 0 as nfailed. The client is r2549 with the Lanczos loop bound from r2169, before r2186 changed the test to max_iterations minus one. That bound takes one step past the allocated tridiagonal. Stock r2549 Lanczos does not match this archive. codes/eon-r2549-lanczos-r2169-bound.patch is that one-line bound.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.01
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = false
