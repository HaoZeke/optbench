id = "eon-svn/de-pt-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "Eon svn"
code_version = "r2156"
commit = "r2156"
algorithm = "Lanczos L-BFGS"
reducer = "archive"
failure_cap = 3000
kernel = "morse_shift"
native_potential = true
note = '''
Paper row for the 29 Aug 2013 Pt-island Lanczos entry. The archive names r2156 in code_version and in code_file eon-r2156.tgz, and report.sh writes that revision. That date is the day report.sh ran. r2168, which adds Lanczos quit_early, is the same day and is not the revision the archive names. The client is unmodified r2156, built with Fortran, using that revision's Morse potential. The ini is the archived config. Omitted keys stay at the r2156 defaults, including finite_difference 0.01. r2156 does not read quit_early. report.sh on this rerun is 451 force calls and 0 failures. The archive is 325 and 5. Stock r2549 on morse_pt is the separate current-SVN row eon-svn/de-pt-lanczos-current (233 calls, 0 failures).
'''
seeds = [1]
budget_seconds = 600

[ini.Main]
job = "saddle_search"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Saddle Search"]
max_iterations = 1000
min_mode_method = "lanczos"
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = false
