id = "eon-svn/de-pt-ci-neb-5"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "CI-NEB"
reducer = "harness"
failure_cap = 3000
kind = "de-pt"
kernel = "morse_shift"
tuning = "default"
asv_class = "EonSvnDePtCiNeb5"
note = '''
EON is the SVN client, not the git eOn client. This row is stock r2549 CI-NEB on the 59 Pt-island products. The archived ini sets images 5, climbing_image true, opt_method lbfgs, converged_force 0.001, and max_iterations 1000. climbing_image_method is the key r2549 reads, and its default is already true. Spring, max_move, and L-BFGS memory stay the client defaults (5.0, 0.2, and 20). The harness kernel is r2549 Morse::force. The client is built with Fortran. Rules.mk in r2549 still names potentials/QSC, which that revision does not contain, so the build omits that stale entry and nothing else.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 5
climbing_image = true
climbing_image_method = true
