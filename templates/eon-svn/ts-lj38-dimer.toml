id = "eon-svn/ts-lj38-dimer"
engine = "eon"
problem = "tsopt/LJ38"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 10000
kind = "ts-lj38"
kernel = "lj40"
asv_class = "EonSvnTsLj38Dimer"
note = '''
Saddle search on the 200 LJ38 starts. LBFGS max_move 0.1, max_iterations 3000, converged_force 0.001. Dimer rotation is conjugate gradient, converged_angle 0.1, rotations_max 20, improved true. improved is the r2549 default; the 2014 file left the key unset. client_displace_type load. direction.dat is Python random.Random of the start index. Main random_seed is 1. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 3000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 3000
displace_magnitude = 0.1

[ini.Dimer]
opt_method = "cg"
improved = true
finite_angle = 0.005
converged_angle = 0.1
rotations_max = 20
rotations_min = 1
