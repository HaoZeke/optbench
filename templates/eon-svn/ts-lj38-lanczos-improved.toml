id = "eon-svn/ts-lj38-lanczos-improved"
engine = "eon"
problem = "tsopt/LJ38"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos improved L-BFGS"
reducer = "harness"
failure_cap = 10000
kind = "ts-lj38"
kernel = "lj40"
asv_class = "EonSvnTsLj38LanczosImproved"
note = '''
EON at SVN r2549, Fortran build, unpatched. This is the old SVN code, not the git eOn client. The ini is the archived config.ini: Lanczos tolerance 0.01, max_iterations 50, quit_early true, saddle max_energy 1000, LBFGS max_move 0.1, max_iterations 3000, converged_force 0.001. direction.dat is archive random_mode.py (numpy.random.seed of the start index, then numpy.random.random). The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40. No keys beyond the archive.
'''
direction = "numpy"
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_move = 0.1
max_iterations = 3000

[ini."Saddle Search"]
min_mode_method = "lanczos"
max_energy = 1000

[ini.Lanczos]
tolerance = 0.01
max_iterations = 50
quit_early = true
