id = "eon-svn/de-pt-ci-swdneb"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Doubly nudged CI-NEB"
reducer = "harness"
failure_cap = 3000
kind = "de-pt"
kernel = "morse"
asv_class = "EonSvnDePtCiSwdneb"
note = '''
Doubly nudged climbing image on the 59 Pt-island products. Images 3, doubly_nudged true, doubly_nudged_switching true, converged_force 0.001, max_iterations 1000. The harness kernel is morse/smooth/linear with D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, and periodic boundaries in x and y.
'''
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini."Nudged Elastic Band"]
images = 3
climbing_image_method = true
climbing_image = true
doubly_nudged = true
doubly_nudged_switching = true
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini.LBFGS]
lbfgs_memory = 20
