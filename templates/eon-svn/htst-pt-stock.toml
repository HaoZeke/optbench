id = "eon-svn/htst-pt-stock"
engine = "eon"
problem = "hTST/Pt"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness-htst"
tuning = "stock"
note = '''
Stock, untuned EON SVN r2549 on the archived hTST/Pt alpha_dimer-qm reactant. The ini is the archived config: temperature 700, seed 42, morse_pt, confidence 1.9, optimizer converged_force 0.001, max_iterations 5000, least-coordinated displacement weight 1, radius 3.3, magnitude 0.3, dimer rotations_max 50, converged_angle 5. Unspecified keys stay at the r2549 defaults, including optimizer cg, dimer improved, dimer opt_method sd, and saddle-search converged_force 0.01. The client is the unpatched r2549 eonclient with Fortran Morse. A start is one barrier window from optbench.htst: the archived 15 barriers below 1.3 eV, rate_ref 155055901.244, prefactor 1.2e12, rate_accuracy 0.999. Force calls are sad-fcs. The stop is one barrier window, the archive average-over count. Nothing was tuned toward the archived means.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/alpha_dimer-qm/pos.con"
pass_limit = 8000
workers = 8

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1e12"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 8
number_of_CPUs = 8
jobs_per_bundle = 1
client_path = "eonclient"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 1000.0

[ini.Dimer]
rotations_max = 50
converged_angle = 5.0
