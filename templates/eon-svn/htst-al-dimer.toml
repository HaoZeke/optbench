id = "eon-svn/htst-al-dimer"
engine = "eon"
problem = "hTST/Al"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer-CG rotation: max=50 tol=1"
reducer = "harness-htst"
pass_limit = 4000
note = "AKMC on the Al adatom. The client binary is eOn git a1ae6103 (28 Jan 2013, the r2006 benchmark day), built with gfortran and without NO_FORTRAN, so eam_al is the Fortran Aluminum EAM. QSC sources are absent at that commit and are not linked. The r2549 Python server drives that client. Temperature 300 K, seed 42, confidence 1.95, confidence_scheme old, thermally_accessible_window 20. finite_difference is 0.01, the 2013 default. The 2013 client stops on Matter::maxForce, the largest per-atom force, and ignores convergence_metric. Dimer rotation is conjugate gradient, improved is true, rotations_max 50, converged_angle 1. The 2013 CG step adds thetaOld times the previous rotational-force norm times gamma and stores thetaOld after normalization, and it does not fold phi_min. r2549 reads displace_atom_list as integer indexes and treats -1 as every free atom, so the list is file index 384, the adatom the 2013 server selected with displace_atomlist -1. r2549 Displace hardcodes a void bias of 0.2. The 2013 displacement is a Gaussian of magnitude 0.5 with no void bias, and the r2549 yaml default of that key is 0. The harness applies void_bias_fraction 0 from this ini. Radius 3.3, magnitude 0.5, listed weight 1. Optimizer converged_force is 0.001, max_iterations 5000, saddle max_energy 100. Structure comparison energy_difference is 0.1, the 2013 default. Prefactor default_value is 1.2e12. A start is one barrier window from optbench.htst. Communicator num_jobs 32."

[ini.Main]
job = "akmc"
temperature = 300
finite_difference = 0.01
random_seed = 42

[ini.Potential]
potential = "eam_al"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "max_atom"
converged_force = 0.001
max_move = 0.2
max_iterations = 5000

[ini.AKMC]
confidence = 1.95
server_side_process_search = false
confidence_scheme = "old"
thermally_accessible_window = 20

[ini."Structure Comparison"]
energy_difference = 0.1
distance_difference = 0.1
remove_translation = false

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1.0
displace_atom_list = "384"
displace_radius = 3.3
displace_magnitude = 0.5
max_energy = 100.0
# r2549 Displace hardcodes 0.2 and ignores this key. The 28 Jan 2013
# server has no void bias, and the r2549 yaml default is 0.
void_bias_fraction = 0.0
max_iterations = 5000
converged_force = 0.001

[ini.Prefactor]
default_value = 1.2e12

[ini.Dimer]
improved = true
opt_method = "cg"
converged_angle = 1
rotations_max = 50
rotations_min = 1
finite_angle = 0.005
