id = "eon-svn/standard-aladatom-langevin"
engine = "eon"
problem = "accelerated-md/standard_aladatom"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Parallel replica"
reducer = "harness"
tuning = "stock"
failure_cap = 20000000
kind = "prd"
kernel = "eam"
native_eam = true
censor_ok = true
asv_class = "EonSvnStandardAladatomLangevin"
note = '''
Stock parallel replica of EON SVN r2549 on the published 151-atom reactant. The 26 Oct 2012 page asks for 150 K, Langevin Verlet, and friction 0.001/fs. This template sets a 1 fs timestep, a 5e6 fs window, dephase 20000 fs, a state check every 1000 fs, a save every 100 fs, 700 fs after a transition, and a CG quench to 0.01 eV/angstrom. An escape is a quenched geometry whose maximum atomic displacement from the minimized reactant exceeds 0.1 angstrom. Exposure is the escape time, or 5 ns when the window ends on the reactant. The rate is the escape count divided by the summed exposure. The uncertainty is that rate divided by sqrt of the escape count. The closed set is successive blocks of 32 seeds, kept through the block that reaches about 134 escapes. r2549 loads stop_after_transition and does not read it, so each trajectory integrates the whole window. total_force_calls is the cost. A finished trajectory counts.
'''
seeds = [1]
starts = ["0"]
asv_full = false
asv_timeout = 7200

[ini.Main]
job = "parallel_replica"
temperature = 150

[ini.Potential]
potential = "eam_al"

[ini."Parallel Replica"]
stop_after_transition = true
dephase_time = 20000
state_check_interval = 1000
state_save_interval = 100
post_transition_time = 700

[ini.Dynamics]
time_step = 1.0
time = 5000000
thermostat = "langevin"
langevin_friction = 0.001

[ini.Optimizer]
opt_method = "cg"
converged_force = 0.01

[ini.Debug]
write_movies_interval = 1000
