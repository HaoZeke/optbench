id = "eon-svn/htst-pt-lbfgs"
engine = "eon"
problem = "hTST/Pt"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer-LBFGS rotation: max=50, tol=1"
reducer = "harness-htst"
pass_limit = 8000
note = "Stock unpatched EON at SVN r2549, built with Fortran. EON is the SVN code and is not a version of the git code eOn. The ini is the archived hTST/Pt/eon-dimer-lbfgs file: temperature 700, seed 42, morse_pt, prefactor 1.2e12, LBFGS, confidence 1.9, minimize_first, dimer rotations_max 50, converged_angle 1. Optimizer convergence_metric is max_atom and converged_force is 0.001, the archive stop. Finite difference, LBFGS memory, inverse curvature, auto scale, angle reset, and distance reset stay at the r2549 client defaults. The local job buffer is 32. Gaps against the archived means are findings."

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = 1.2e12

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "max_atom"
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
max_energy = 1000.0

[ini.Dimer]
rotations_max = 50
converged_angle = 1.0
