id = "eon-svn/low-lj38-lanczos-ljcut"
engine = "eon"
problem = "lowest-eigenvector/lj38"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos CG"
reducer = "harness"
failure_cap = 10000
kind = "lowest"
kernel = "lj40"
asv_class = "EonSvnLowLj38LanczosLjcut"
note = '''
This id is separate from eon-svn/low-lj38-lanczos. That row uses the develop ljcluster kernel. This row uses unshifted lj/cut cutoff 40.
Lowest mode with Lanczos. Tolerance 0, as in the 2014 file that left the iteration count as CHANGEME. The harness walks max_iterations from 1. Overlap target 0.99. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
overlap = 0.99
iteration_limit = 1000
seeds = [1]
asv_timeout = 1800
budget_seconds = 1200

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini."Saddle Search"]
max_iterations = 0
min_mode_method = "lanczos"
client_displace_type = "load"
