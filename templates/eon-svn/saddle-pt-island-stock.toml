id = "eon-svn/saddle-pt-island-stock"
engine = "eon-client"
problem = "saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
tuning = "stock"
failure_cap = 5064
note = """Stock EON SVN r2549, Fortran build, no source patch. process_search on the Pt island. The ini sets only the archive force stop, 0.001 eV/Angstrom. Dimer, optimizer, bowl, prefactor, and max energy stay at the binary defaults. Each start is one displacement: epicenter uniform on atoms 0-6, neighbors inside 3.3 Angstrom, Gaussian kicks of standard deviation 0.1, and a second Gaussian as the mode. Seeds are 1 through 9, one search for each archived repetition. The harness kernel is morse/smooth/linear. The cap is the problem per-search budget. The client total is not the score."""

[ini.Main]
job = "process_search"
temperature = 700
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini.Optimizer]
converged_force = 0.001

[ini."Saddle Search"]
min_mode_method = "dimer"
converged_force = 0.001
