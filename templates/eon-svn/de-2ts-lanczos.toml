id = "eon-svn/de-2ts-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/lj38_2ts_separation"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos L-BFGS"
reducer = "harness"
failure_cap = 250000
kind = "de-2ts-mode"
kernel = "lj40"
asv_class = "EonSvnDe2tsLanczos"
note = '''
Lanczos on the interpolated end points of all 51 pairs. converged_force 0.001, max_move 0.1, saddle max_iterations 250000. Lanczos max_iterations 20, tolerance 0.05, quit_early false. failure_cap is the problem cap, 250000. convergence_metric norm is the Euclidean force norm. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
seeds = [1]
asv_timeout = 1200
budget_seconds = 0

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 250000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 250000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 20
tolerance = 0.05
quit_early = false
