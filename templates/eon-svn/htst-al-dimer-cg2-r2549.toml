id = "eon-svn/htst-al-dimer-cg2-r2549"
engine = "eon"
problem = "hTST/Al"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer-CG rotation: max=10 tol=1"
reducer = "harness"
failure_cap = 2000000
seeds = [42]
starts = ["al"]
geometry = "website/hTST/Al/eon-dimer-cg2/pos.con"
pass_limit = 1
workers = 1
note = """
EON, the SVN client, at r2549. This is not eOn. The binary is the unpatched henkelman mirror of r2549, linked with gfortran so Aluminum::force is the Fortran EAM, and eonclient -v prints r2549. The harness replaces the potential with ext_pot and counts every force() through the r2549 Aluminum Fortran kernel. The ini is the archive convergence and the archive displacement: temperature 300, seed 42, confidence 1.95, prefactor 1.2e12, converged_force 0.001, max_iterations 5000, dimer CG, rotations_max 10, converged_angle 1, radius 3.3, magnitude 0.5, listed adatom 384 (archive displace_atomlist -1). finite_difference, improved, and the optimizer method stay at the r2549 defaults. Each seed is a fresh AKMC from state 0. A barrier seed stops when the eight reference processes, four 0.233 eV and four 0.372 eV, have been seen. A rate seed stops when the unique-process rate sum, prefactor 1.2e12 at 300 K, reaches 0.999 of 592041917. The sample is 432 barrier seeds and 11 rate seeds. Potential::fcalls counts both dimer images, so sad-fcs + mins-fcs equals the harness. The harness total is the count. scripts/htst_al_windows.py runs and resumes the seeds.
"""

[ini.Main]
job = "akmc"
temperature = 300
random_seed = 42

[ini.Potential]
potential = "eam_al"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.95

[ini.Prefactor]
default_value = 1.2e12

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 1
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1.0
displace_atom_list = "384"
displace_radius = 3.3
displace_magnitude = 0.5
max_energy = 100.0

[ini.Dimer]
opt_method = "cg"
converged_angle = 1
rotations_max = 10
