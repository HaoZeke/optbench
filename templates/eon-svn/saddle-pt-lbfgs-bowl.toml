id = "eon-svn/saddle-pt-lbfgs-bowl"
engine = "eon-client"
problem = "saddle-search/pt-island"
code = "EON"
code_version = "(SVN r2549)"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
failure_cap = 100000000
tuning = "default"
note = """Stock EON SVN r2549, unpatched, Fortran potentials linked. Label EON (SVN r2549). This is not the git code eOn. Pt-island displacement and stop, with every unset key left at the r2549 default. Dimer rotations_max 5, converged_angle 20, translation L-BFGS, max_energy 5 eV, confine_positive and bowl_breakout on, confine_positive_min_active 20. bowl_active_atoms stays the default 20. improved stays the default true. The dimer rotation optimizer stays the default CG. Displacement is atoms 0-6, radius 3.3, magnitude 0.1. Stop at 27 good saddles below 1.5 eV. search_budget in the problem file is one displacement search: climb 1000, 64 calls of overshoot, and two endpoint budgets of 2000, which is 5064. That number is not the budget of the 27-saddle campaign. failure_cap is the harness ceiling for one seed so the campaign can record 27 good saddles. The ranked cost is the campaign total of harness force calls through the search that records the 27th good saddle below 1.5 eV. The initial minimization is outside the per-search count. The harness counts ext_pot calls on r2549 Morse::force (cutoff 9.5, shifted, minimum image). No parameter was moved."""

pass_limit = 2000

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 10
number_of_CPUs = 2
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001
confine_positive = true
bowl_breakout = true
confine_positive_min_active = 20

[ini.Dimer]
rotations_max = 5
converged_angle = 20.0

[ini.Prefactor]
default_value = 5e12
