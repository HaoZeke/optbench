id = "eon-svn/de-pt-ci-neb-single"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "Eon svn"
code_version = "r2156"
commit = "r2156"
algorithm = "CI-NEB"
reducer = "report-capped"
failure_cap = 3000
note = '''
Single-image climbing-image NEB on the 59 Pt-island products. Unpatched SVN r2156, Fortran linked, built-in morse_pt (Morse::force in that revision). g++ 13 compiles the 2013 sources as gnu++98. No source edits. The archived ini is copied as written: images 1, climbing_image true, L-BFGS, converged_force 0.001, max_iterations 1000. r2156 reads climbing_image_method, which stays at its default true, so the band climbs. Spring stays 5, max_move stays 0.2, and L-BFGS memory stays 20. The score is the client's total_force_calls. report.sh averages every total_force_calls under 3000 and counts a non-zero termination_reason as a failure.
'''

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 1
climbing_image = true
