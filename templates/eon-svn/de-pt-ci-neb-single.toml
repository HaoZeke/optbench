id = "eon-svn/de-pt-ci-neb-single"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "EON"
code_version = "(SVN r2549)"
commit = "r2549"
algorithm = "CI-NEB"
reducer = "harness"
failure_cap = 3000
kind = "de-pt"
kernel = "morse_shift"
asv_class = "EonSvnDePtCiNebSingle"
note = '''
Single-image climbing-image NEB on the 59 Pt-island products. EON is the SVN client, not the git eOn client. This build is unpatched SVN r2549 with Fortran linked. The archived ini is copied as written: images 1, climbing_image true, L-BFGS, converged_force 0.001, max_iterations 1000. No spring, max_move, memory, or tangent change. r2549 reads climbing_image_method, which stays at its default true, so the band climbs. The harness replaces morse_pt with ext_pot and counts HarnessCounter. The kernel is r2549 Morse::force: cutoff 9.5, pair energy shifted to zero at the cutoff, minimum image on the box diagonal. D 0.7102, alpha 1.6047, r0 2.897.
'''
seeds = [1]
asv_timeout = 3600

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 1
climbing_image = true
