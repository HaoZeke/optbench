note = '''
Stock eOn built from origin/develop b0bd4d5a, the merge of pull request 784. That commit contains 8468a7cd and 500350d9. Starts from any other binary are not part of this row. The client version string is 3.6.0. The force-call cap is 2000000. That number is sample.max_evaluations in problems/globalopt/lj100-binary.toml and the archive report.sh window ($2 <= 2e6). A start that reaches the cap is charged 4000000. The ini is the archive config.ini: temperature 14000, 60000 basin-hopping steps, displacement 0.3 (the archive names this max_displacement; the client reads displacement), gaussian draws, significant_structure, swap_probability 0, L-BFGS, converged_force 0.001, max_iterations 10000. random_seed is 1. The harness counts every ext_pot force call and stops at the cap. The potential matches the archive in.lammps binary Lennard-Jones: first species sigma 1.3, second sigma 1.0, cross 1.15, epsilon 1, cutoff 20, no shift. The ext_pot reply is that energy and the LAMMPS lj/cut force, F = -dE/dx, in metal units (eV, Angstrom).
'''

[ini.Main]
job = "basin_hopping"
quiet = true
write_log = false
temperature = 14000
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini."Basin Hopping"]
steps = 60000
displacement = 0.3
significant_structure = true
displacement_distribution = "gaussian"
swap_probability = 0.0

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 10000
