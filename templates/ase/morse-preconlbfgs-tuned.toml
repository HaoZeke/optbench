id = "ase/morse-preconlbfgs-tuned"
engine = "ase"
code = "ASE"
code_version = "3.29.0"
commit = "f27c0005ae6a67ea419f996e728668865bfc1f86"
algorithm = "PreconLBFGS"
problem = "minimization/morse-bulk"
task = "minimize"
profile = "tuned"
reducer = "capped"
ranked = true
parameter_source = "archive"
note = "Archive minimization/morse-bulk/ase-preconLBFGS/opt.py reads pos_*.con with ase.io.read, which leaves pbc false, builds tsase morse(rc=9.5), and runs PreconLBFGS(Exp A=3, maxstep=0.1) at fmax 0.01. tsase morse.f still minimum-images on the cell. The Exp neighbor list follows atoms.pbc."

[optimizer]
name = "PreconLBFGS"

[optimizer.parameters]
maxstep = 0.1

[optimizer.parameters.precon]
name = "Exp"
A = 3.0

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
rc = 9.5
form = "shift"
pbc = [false, false, false]
minimum_image = true

[stop]
norm = "fmax"
fmax = 0.01
max_force_calls = 10000
max_steps = 10000

[input]
archive_path = "website/minimization/morse-bulk/morse-bulk.tgz"
select = "con"
