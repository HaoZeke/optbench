id = "pyamff/emt-pt38-lbfgs-force"
engine = "pyamff"
problem = "mlopt/emt-pt38"
code = "pyamff"
code_version = "0.1.0-beta"
commit = "240f51d01ca22969369f9bc21760c61cbb3b6665"
algorithm = "LBFGS"
tuning = "default"
note = "PyAMFF 0.1.0-beta at 240f51d01ca22969369f9bc21760c61cbb3b6665. Stock LBFGS from that release, learning rate 0.01, on the 10-7 tanh network. Force coefficient 0.1. Force training stops when max(abs(parameter gradient)) is strictly below 0.1, or at 30000 evaluations. Weights are uniform on [-1, 1), seeded from 20261015 plus the start index. Fingerprints are the archived Fortran Behler-Parrinello set. A capped start scores twice the cap."

[pyamff]
optimizer = "LBFGS"
learning_rate = 0.01
hidden_layers = [10, 7]
activation = "tanh"
loss = "SSE"
energy_coefficient = 1.0
force_coefficient = 0.1
force_training = true
initial_weights = "random_uniform"
seed_base = 20261015

[stop]
max_steps = 30000
gradient_norm = 0.1
norm = "max_abs"
