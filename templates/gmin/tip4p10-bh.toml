note = """
Basin hopping of 10 rigid TIP4P waters. The binary is Wales GMIN SVNREV 27059 from the August 2014 snapshot wales-27058.tar.bz2, sha256 144a703eef674a826191308b9f8dfda548d88fc7a50323687e7cc1f6e64bf348. The build is serial gfortran with system BLAS and LAPACK, MPI off, OpenMP off. The input is archive/entries/globalopt/tip4p10/gmin/data: NTIP 4, CENTRE, EDIFF 1.D-3, SLOPPYCONV 1.D-3, TIGHTCONV 1.D-3, MAXIT 1.D4 1.D4, FIXBOTH, RANSEED 100, RADIUS 1.D1, MAXBFGS 1.D0, MAXERISE 1.D-4, TARGET -391.0233D0, SAVE 1, STEPS 2.D6, STEP 0.D0 0.D0 1.64D0, TEMPERATURE 6.65D0. Starts are the 10000 archived angle-axis files. force_calls is NPCALL, the seventh awk field of "Target hit after". A start with no target line is a failure and is left out of the mean. This is GMIN's own function-call counter, not the harness counter. gfortran 13 needed the two length-1 slices in biased_torsional_sampling.f90 extended to three elements so the unused routine would compile. That routine is not on the TIP4P path.
