note = "Parallel tempering basin-hopping. Four replicas, temperatures geometric from 0.1 to 1, exchange probability 0.1. Quenches are L-BFGS with SLOPPYCONV 0.005, TIGHTCONV 0.001, MAXIT 600 and 500. STEP is 0.40 and ASTEP is 0.51. The container radius is 50 and the coordinates are translated to the origin, so the archived start is inside the container. CENTRE keeps the cluster at the origin. The random seed is 20261018 plus the start index. The failure cap is 2000000 harness calls. The problem file leaves max_force_calls unset. TARGET is the harness energy of codes/gmin/reference/lj150.points. EDIFF is 0.001. globalopt/lj150 states no energy window and no start count. The result is partial. EDIFF 0.001 is the lj38 tolerance, used here so a start can stop on the Cambridge point. The data file starts with MPI because the binary is the MPI build, and mpirun launches it, including the one-replica run. Starts are the numbered coords files in the website tarball: 200 for lj75, 100 for lj98 and lj150. The unnumbered coords file is not a start."

