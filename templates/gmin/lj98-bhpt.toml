note = "Parallel tempering basin-hopping with the archived lj98 symmetrise moves. Four replicas, temperatures geometric from 0.1 to 1.3, exchange probability 0.1. The hot end is the archive temperature 1.3. On the MPI binary, mc replaces TEMPERATURE with that ladder. Quenches are L-BFGS with SLOPPYCONV 0.007, TIGHTCONV 1.0e-5, and MAXIT 1000 and 1000. STEP is 0.46 and ASTEP is 0.47. FIXBOTH, PERMDIST 0.01, NEWRESTART 6, SORT, SAVE 1, and SYMMETRISE 1 0.01 0.05 0.3 0.1 0.6 3 0.3 2.1 are the archive data file. STEPS is 100000 1.0, the archive stop, which does not bind before the call budget. The archive sets no RADIUS and no RANSEED. A fixed radius of 50 lets the cluster evaporate and miss the minimum inside the call budget, so RADIUS is omitted and the coordinates are not translated before CENTRE. The archive states no MAX_NPCALL. One trajectory's ceiling is 2307433, the 03 Oct 2022 energy-call mean 2.4953780e+05 plus ten times its standard deviation 2.0578948e+05. The harness counts every replica, so four replicas share 9229732 calls. The failure cap and MAX_NPCALL are both that budget. A ceiling of 2307433 stops the four-replica search after about one trajectory and charges PAR-2 there. A 1000000000 cap is not used. EDIFF is 0.001, the problem energy_above_minimum. TARGET is the harness energy of codes/gmin/reference/lj98.points. The data file starts with MPI because the binary is the MPI build, and mpirun launches it. A symmetry hit used to leave that replica with GOTO 37 while the others blocked in BHPT_EXCHANGE. codes/gmin/build-bh.sh keeps the hit on that rank and lets BHPT_TARGET take every rank out of the loop together. One replica still exits on HIT. Starts are the 100 numbered coords files. The unnumbered coords file is not a start."

