id = "tsase-rank/htst-pt-alpha-dimer"
engine = "eon"
problem = "hTST/Pt"
code = "TSASE"
code_version = "1.0"
commit = "98aac60b5d9905e81ee4e6b8c385f169258d0218"
algorithm = "alphaDimer-QM"
reducer = "harness-htst"
tuning = "stock"
note = '''
Stock TSASE 1.0, pin 98aac60b5d9905e81ee4e6b8c385f169258d0218, on the archived hTST/Pt alpha_dimer-qm reactant. The AKMC server is unpatched EON SVN r2549 with the archived ini: temperature 700, seed 42, confidence 1.9, optimizer converged_force 0.001, max_iterations 5000, least-coordinated displacement weight 1, radius 3.3, magnitude 0.3, dimer rotations_max 50, converged_angle 5. The client is clients/tsase_alpha_dimer_qm.py. It calls the pin SSDimer_atoms with ss=False. That constructor has no alpha or alpha2 argument, so the 2013 alpha switch is not in this pin. Search minForce is 0.001 and the endpoint FIRE fmax is 0.001, phi_tol 5, rotationMax 50, maxStep 0.2. The energy is the pin Fortran Morse, built with f2py and not edited. A start is one barrier window from optbench.htst. Force calls are sad-fcs. Nothing was tuned toward the archived means.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/alpha_dimer-qm/pos.con"
pass_limit = 8000
workers = 8

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1e12"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 8
number_of_CPUs = 8
jobs_per_bundle = 1
client_path = "tsase_alpha_dimer_qm.py"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 1000.0

[ini.Dimer]
rotations_max = 50
converged_angle = 5.0
