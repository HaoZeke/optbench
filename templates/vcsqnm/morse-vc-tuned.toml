id = "vcsqnm/morse-vc-tuned"
engine = "vcsqnm"
problem = "minimization/morse-bulk"
code = "vc-SQNM"
code_version = "1.3"
commit = "4241692173cccb42a9ae05974bfd62285ec2cd7b"
algorithm = "vc-SQNM"
tuning = "tuned"
note = "Variable-cell SQNM on the Morse pair potential. The cell is a coordinate. The atomic force uses the problem L2 stop, and the max-norm of dE/dA uses that same number. Python periodic_sqnm multiplies the supplied lattice derivative by -1, so the harness passes -dE/dA and the step descends. lattice_weight is 2. The call goes through periodic_sqnm. Tuned row: history length 20 and eps_subsp 1e-4."

[sqnm]
method = "vc"
initial_step_size = -1e-07
nhist_max = 20
alpha_min = 0.001
eps_subsp = 0.0001
lattice_weight = 2.0

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
