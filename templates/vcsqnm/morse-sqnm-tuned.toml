id = "vcsqnm/morse-sqnm-tuned"
engine = "vcsqnm"
problem = "minimization/morse-bulk"
code = "vc-SQNM"
code_version = "1.3"
commit = "4241692173cccb42a9ae05974bfd62285ec2cd7b"
algorithm = "SQNM"
tuning = "tuned"
note = "Fixed-cell SQNM. initial_step_size is -1e-7, alpha_min is 1e-3, and the stop is the problem force norm. The ASE wrapper constructor uses initial_step_size -0.01. On the stiffest LJ38 start a force component is 6.1e5, and that constructor coefficient carries the atom past the cutoff, where the force is zero. -1e-7 holds the first displacement under 0.07 sigma. Morse bulk uses the same coefficients. The call goes through free_sqnm. Tuned row: history length 20 and eps_subsp 1e-4."

[sqnm]
method = "sqnm"
initial_step_size = -1e-07
nhist_max = 20
alpha_min = 0.001
eps_subsp = 0.0001
lattice_weight = 2.0

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
