id = "vcsqnm/morse-sqnm-tuned"
engine = "vcsqnm"
problem = "minimization/morse-bulk"
code = "vc-SQNM"
code_version = "1.3"
commit = "4241692173cccb42a9ae05974bfd62285ec2cd7b"
algorithm = "SQNM"
tuning = "adjusted"
note = "Fixed-cell SQNM. initial_step_size is -1e-7 and alpha_min is 1e-3. The stop is the problem force norm. The ASE wrapper constructor uses initial_step_size -0.01 and eps_subsp 1e-3. On the stiffest LJ38 start a force component is about 6.1e5, and -0.01 carries that atom past the cutoff, where the force is zero. eps_subsp 1e-3 also lets a later step leave the cutoff. eps_subsp 1e-5 keeps every archived LJ38 start bound. Morse bulk uses the same coefficients. The call goes through free_sqnm. Tuned row: history length 20. eps_subsp stays 1e-5."

[sqnm]
method = "sqnm"
initial_step_size = -1e-07
nhist_max = 20
alpha_min = 0.001
eps_subsp = 1e-05
lattice_weight = 2.0

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
