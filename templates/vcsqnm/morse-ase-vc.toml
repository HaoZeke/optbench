id = "vcsqnm/morse-ase-vc"
engine = "vcsqnm"
problem = "minimization/morse-bulk"
code = "vc-SQNM"
code_version = "1.3"
commit = "4241692173cccb42a9ae05974bfd62285ec2cd7b"
algorithm = "ASE-vc-SQNM"
tuning = "default"
note = "Variable-cell SQNM on the Morse pair potential. The cell is a coordinate. The atomic force uses the problem L2 stop, and the max-norm of dE/dA uses that same number. Python periodic_sqnm multiplies the supplied lattice derivative by -1, so the harness passes -dE/dA and the step descends. lattice_weight is 2. The call goes through aseOptimizer with vc_relax true. The calculator stress is (dE/dA) A^T / det(A), so the wrapper's deralat equals -dE/dA. History length 10 and eps_subsp 1e-5."

[sqnm]
method = "ase-vc"
initial_step_size = -1e-07
nhist_max = 10
alpha_min = 0.001
eps_subsp = 1e-05
lattice_weight = 2.0

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
