id = "eon-develop-rank/htst-pt-stock"
engine = "eon"
problem = "hTST/Pt"
code = "eOn (develop 500350d9)"
code_version = "3.6.0"
commit = "500350d9fae881f06c7ef194e5868da079c4be5a"
algorithm = "Dimer"
reducer = "harness-htst"
tuning = "stock"
note = '''
Stock, untuned eOn at 500350d9fae881f06c7ef194e5868da079c4be5a on branch fix/develop-regressions-vs-350. Same hTST/Pt reactant, seed, displacement, and convergence as the archived alpha_dimer-qm config. Unspecified keys stay at that tree's defaults. The client is that tree's eonclient and the potential is its morse_pt. A start is one barrier window from optbench.htst, the same 15 barriers, rate_ref, prefactor, and rate_accuracy as the 2014 report. Force calls are sad-fcs. This code is not EON SVN. Nothing was tuned toward the archived means.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/alpha_dimer-qm/pos.con"
pass_limit = 8000
workers = 8

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1e12"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 8
number_of_CPUs = 8
jobs_per_bundle = 1
client_path = "eonclient"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 1000.0

[ini.Dimer]
rotations_max = 50
converged_angle = 5.0
