id = "eon-develop-rank/htst-pt-stock"
engine = "eon"
problem = "hTST/Pt"
code = "eOn (develop a7aa57472fb7d823953fd36b78cd755fa4842d30)"
code_version = "3.6.0"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Dimer"
reducer = "harness"
failure_cap = 2000000
kind = "htst"
kernel = "morse_shift"
tuning = "stock"
note = '''
Stock, untuned eOn develop on the same hTST/Pt reactant, seed, displacement, and convergence as the archived alpha_dimer-qm config. Unspecified keys stay at the develop defaults. The harness scores the same Morse::force kernel through ext_pot. The start ends at the first good saddle below 1.5 eV. Nothing was tuned toward the archived window means. This code is not EON SVN.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/alpha_dimer-qm/pos.con"
pass_limit = 40
workers = 8
budget_seconds = 1200

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1e12"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 8
number_of_CPUs = 8
jobs_per_bundle = 1
client_path = "eonclient"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 1000.0

[ini.Dimer]
rotations_max = 50
converged_angle = 5.0
