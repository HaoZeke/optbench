# pARTn catalog on the Pt island. The goal is 27 connected saddles under 1.5 eV.
id = "partn/saddle-pt"
engine = "partn"
problem = "saddle-search/pt-island"
code = "artn"
code_version = "1.1.0"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
algorithm = "ARTn"
tuning = "beland-radial"
note = "The previous optbench-pt111 row copied examples/OptBench_SaddleSearch.d: ninit 3, lanczos_max_size 20, eigen_step_size 0.3, and an in-plane push on 1 to 7 of atoms 0-6 with length 0.05 to 0.5 angstrom. That push is what collapsed 138 linked searches onto 3 saddles. This row is the Béland 2015 / pARTn radial profile: ninit 1, push_step_size 0.4 angstrom, every free atom within radius 3.0 angstrom of one island atom, lanczos_min_size 12, lanczos_max_size 15. The center is drawn from atoms 0-6. The vector is the pARTn rad draw, scaled to 0.4 angstrom, and it is not in-plane. One numpy stream, seed 20261015 plus the repetition, draws a new center and a new vector for each search. zseed still comes from the search name. fire_dt_init 4.134, fire_dt_max_f 2, nsmooth 2, and nnewchance 2 stay the Pt111 values. The potential stays morse/smooth/linear, the pair the pARTn OptBench example names. The archive eOn rows use morse_pt, which shifts the pair energy to zero at cutoff 9.5 and leaves the force unsmoothed. search_budget 2000. max_searches 200. The link is the eOn r2205 per-atom maximum, distance_difference 0.1 angstrom. rmsd_connect remains the saddle-novelty test."

[partn]
push_step_size = 0.4
eigen_step_size = 0.3
ninit = 1
lanczos_max_size = 15
lanczos_min_size = 12
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
lpush_final = true
converge_property = "norm"
nsmooth = 2
nnewchance = 2
eigval_thr = -0.05
push_over = 1.0
nperp_limitation = [6, 10, 12, 14, -1]
etot_diff_limit = 42.0
fire_dt_init = 4.134
fire_dt_max_f = 2.0

[search]
repetitions = 1
push = "radial"
displace_atoms = "0,1,2,3,4,5,6"
radius = 3.0
displace_magnitude = 0.1
rmsd_connect = 0.5
max_searches = 200
search_budget = 2000
