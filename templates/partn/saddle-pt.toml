# pARTn catalog on the Pt island. The goal is 27 connected saddles under 1.5 eV.
id = "partn/saddle-pt"
engine = "partn"
problem = "saddle-search/pt-island"
code = "artn"
code_version = "1.1.0"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
algorithm = "ARTn"
tuning = "optbench-pt111"
note = "Settings from examples/OptBench_SaddleSearch.d/launch_script.py and examples/LAMMPS.Pt111.d. The cell is the geometry box 19.2088 x 19.0118 x 30. fire_dt_init 4.134 is the Pt111 timestep 0.0002 ps divided by AU_PS 4.83776865317143e-5. fire_dt_max_f is 2, so the FIRE step can grow once from that timestep. The LAMMPS examples cap the step with dmax, and that cap is not a next_displ input. The push is in-plane on 1 to 7 island atoms, lengths 0.05 to 0.5 angstrom. nnewchance 2 and nsmooth 2 are the Pt111 artn.in values. search_budget 2000 is the authors' minimize maxeval. The scored geometry is tau_sad. The displacement returned on the call that stores the saddle is the push off the saddle, and the loop stops before applying it. The harness connection test minimizes the two endpoints. Letting that push run with no dmax walks the FIRE step to about 60 angstrom and spends the budget after the saddle is already stored. max_searches is 200. The link is the eOn r2205 per-atom maximum, distance_difference 0.1 angstrom. A repeat is AKMCState.find_repeat: barrier within 0.01 eV and the same per-atom test on the saddle. fraction_connected is the done.py ratio."

[partn]
push_step_size = 0.5
eigen_step_size = 0.3
ninit = 3
lanczos_max_size = 20
lanczos_min_size = 2
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
lpush_final = true
converge_property = "norm"
nsmooth = 2
nnewchance = 2
eigval_thr = -0.05
push_over = 1.0
nperp_limitation = [6, 10, 12, 14, -1]
etot_diff_limit = 42.0
fire_dt_init = 4.134
fire_dt_max_f = 2.0

[search]
repetitions = 1
push = "surface"
displace_atoms = "0,1,2,3,4,5,6"
min_atoms = 1
max_atoms = 7
dmin = 0.05
dmax = 0.5
displace_magnitude = 0.1
max_searches = 200
search_budget = 2000
