# pARTn 1.1.0. One ARTn search from the reactant of each pair.
# The product chooses the initial push. The run does not build a band.
id = "partn/artn"
engine = "partn"
code = "artn"
code_version = "1.1.0"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
algorithm = "ARTn"
tuning = "default"
note = "forc_thr is the problem force norm. engine_units is lammps/metal on Morse platinum and lammps/lj on Lennard-Jones. The push is one free atom, length push_step_size, from the reactant toward the product. zseed is derived from the pair name and seed 0."

[partn]
push_step_size = 0.1
eigen_step_size = 0.15
ninit = 3
lanczos_max_size = 16
lpush_final = false
converge_property = "norm"
