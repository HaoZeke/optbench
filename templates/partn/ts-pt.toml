# pARTn from each pt-island transition-state guess.
id = "partn/ts-pt"
engine = "partn"
problem = "tsopt/pt-island"
code = "artn"
code_version = "1.1.0"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
algorithm = "ARTn"
tuning = "pt111"
note = "ninit is 0, so Lanczos starts at the guess. Metal settings are examples/LAMMPS.Pt111.d/artn.in: nsmooth 2, nnewchance 2, eigen_step_size 0.25, push_over 1.0, lanczos_disp 1e-4, lanczos_max_size 20, etot_diff_limit 42. nperp_limitation is the OptBench saddle-search list. fire_dt_init 4.134 is timestep 0.0002 ps. fire_dt_max_f is 1, so the timestep cannot grow. The cell is the geometry box."

[partn]
push_step_size = 0.25
eigen_step_size = 0.25
ninit = 0
lanczos_max_size = 20
lanczos_min_size = 2
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
lpush_final = false
converge_property = "norm"
nsmooth = 2
nnewchance = 2
eigval_thr = -0.05
push_over = 1.0
nperp_limitation = [6, 10, 12, 14, -1]
etot_diff_limit = 42.0
fire_dt_init = 4.134
fire_dt_max_f = 1.0
