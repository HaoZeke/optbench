# pARTn from each LJ38 transition-state guess.
id = "partn/ts-lj38"
engine = "partn"
problem = "tsopt/LJ38"
code = "artn"
code_version = "1.1.0"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
algorithm = "ARTn"
tuning = "default"
note = "ninit is 0. engine_units is lammps/lj. fire_dt_init is 0.05 and lanczos_disp is 0.001. etot_diff_limit is 1e6 because the library default of 80 is below ordinary LJ energy changes. The FIRE default of 20 leaves the cluster."

[partn]
