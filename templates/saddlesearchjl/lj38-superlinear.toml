id = "saddlesearchjl/lj38-superlinear"
engine = "saddlesearchjl"
problem = "tsopt/LJ38"
code = "saddlesearchjl"
code_version = "0.0.2"
commit = "47b4f35953bb3fc0f0726c171adca8f5b628af5e"
algorithm = "Superlinear dimer"
tuning = "default"

[ini.Main]
job = "saddle_search"

[ini.Optimizer]
opt_method = "superlinear"
convergence_metric = "norm"
converged_force = 0.001
max_iterations = 10000

[search]

method = "superlinear"
maximum_translation = 0.001
max_num_rot = 1
extrapolate = true
translation_method = "CG"

len = 0.001
tol_rot = 0.01
mode_seed = "gradient"
