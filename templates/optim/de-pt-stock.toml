note = "Current Wales svn.tar.bz2, OPTIM source df8da599267534fbe43a250e578f7396a7946311, INCLUDE revision 26635. The deck is the documented NEWCONNECT plus NEWNEB connection with hybrid eigenvector following. NEWNEB uses 6 images because archive comments.txt says six images are used in DNEB; that first field is the interior image count. The shared problem file sets band.interior_images to 3, which is the per-image divisor for the other rows. NEWNEB iterations, BFGSTS step fields, BFGSSTEPS, and STEPS are the problem force-call cap 3000. The band RMS stays at the OPTIM default 0.01. BFGSMIN is the problem RMS gradient 0.001. BULK carries the periodic cell in the same reduced units as PARAMS, so the connection distance is not taken in a zero box. Spring constant, push-off, eigenvalue tolerance, and image density stay at OPTIM defaults. NOHESS is set because morse bulk has no analytic second derivatives. NONEBMIND keeps the supplied endpoints. The score is the last energy+gradient count, the band total, on the harness counter. A start fails when that tally is missing, has no Converged to TS line, or is at least the cap."

