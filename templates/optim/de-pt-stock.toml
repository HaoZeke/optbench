note = "Current Wales svn.tar.bz2, INCLUDE revision 26635, OPTIM source df8da599. The deck is the documented NEWCONNECT plus NEWNEB connection with hybrid eigenvector following. NEWNEB uses the problem's 3 images, 3000 iterations, and RMS 0.001. BFGSTS step fields, BFGSSTEPS, and STEPS are the problem force-call cap 3000. BFGSMIN is the problem RMS 0.001. BULK carries the periodic cell in the same reduced units as PARAMS, so the connection distance is not taken in a zero box. Spring constant, push-off, eigenvalue tolerance, and image density stay at OPTIM defaults. NOHESS is set because morse bulk has no analytic second derivatives. NONEBMIND keeps the supplied endpoints. The score is the last energy+gradient count on the harness counter. A start fails when the log has no Converged to TS line."

