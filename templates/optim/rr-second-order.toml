# Second-order Rayleigh-Ritz on the archived LJ38 xyz set.
# Paper binary: wales-27058.tar.bz2. OPTIM/source/SVNREV in that tarball is 27059.
id = "optim/rr-second-order"
engine = "optim-loweig"
code = "OPTIM"
code_version = "27058"
commit = "144a703eef674a826191308b9f8dfda548d88fc7a50323687e7cc1f6e64bf348"
algorithm = "hybrid eigenvector following"
problem = "lowest-eigenvector/lj38"
task = "lowest-eigenvector"
profile = "archive"
reducer = "all"
ranked = false
parameter_source = "archive"
note = "wales-27058.tar.bz2. Archived website preamble unchanged: usediag 2, updates 4 100, maxbfgs 0.2 1.0, eigenonly 1D-13 0.99, READVEC. EVPC defaults to 50. No BFGSTSPC. The score is OPTIM energy+gradient calls, not the harness socket."

[optimizer]
name = "XMYLBFGS"

[optimizer.parameters]
usediag = 2
mupdate = 4
xmupdate = 100
maxbfgs = 0.2
maxxbfgs = 1.0
ceig = 1e-13
cover = 0.99
evpc = 50.0

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
rc = 40.0
pbc = [false, false, false]

[stop]
norm = "overlap"
overlap = 0.99
max_force_calls = 10000

[input]
archive_path = "website/lowest-eigenvector/lj38/coords.tar.gz"
