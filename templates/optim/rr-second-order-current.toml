# Same archived preamble on the later OPTIM snapshot. Not the paper baseline.
id = "optim/rr-second-order-current"
engine = "optim-loweig"
code = "OPTIM"
code_version = "df8da599"
commit = "df8da599267534fbe43a250e578f7396a7946311"
algorithm = "hybrid eigenvector following"
problem = "lowest-eigenvector/lj38"
task = "lowest-eigenvector"
profile = "archive"
reducer = "all"
ranked = false
parameter_source = "archive"
note = "Later snapshot df8da599 on the archived website preamble. keywords.F90 sets EVPC to 1. No BFGSTSPC. The energy+gradient mean is outside the archive. This is not the paper baseline."

[optimizer]
name = "XMYLBFGS"

[optimizer.parameters]
usediag = 2
mupdate = 4
xmupdate = 100
maxbfgs = 0.2
maxxbfgs = 1.0
ceig = 1e-13
cover = 0.99
evpc = 1.0

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
rc = 40.0
pbc = [false, false, false]

[stop]
norm = "overlap"
overlap = 0.99
max_force_calls = 10000

[input]
archive_path = "website/lowest-eigenvector/lj38/coords.tar.gz"
