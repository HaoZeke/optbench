algorithm = "LBFGS"
tuning = "default"
failure_cap = 30000
note = "Default row. L-BFGS keeps 10 vector pairs and takes its step from the Optax zoom line search. Each line-search evaluation counts. Energy coefficient 1 and force coefficient 0.1. The gradient tolerance is 0.1 and the cap is 30000 calls. The network is the PyAMFF 10-7 tanh model on the Behler-Parrinello fingerprints of the C2H4 trajectory. The loss is the PyAMFF squared error. A start stops when every parameter gradient component is below the tolerance, or when the energy RMSE is below 0.0001 and the force RMSE is below 0.01. One harness call is one evaluation of that loss and its gradient. Initial weights are uniform[-1, 1) from jax.random.key(20261018 + start). A start that first meets the stop on the call at the cap is a cap failure."

[optax]
method = "lbfgs"
hidden_layers = [10, 7]
activation = "tanh"
seed = 20261018
neighbor_cutoff = 6.0
fingerprints = "archive/entries/mlopt/C2H4/pyamff-adam10-7-fcoeff0/fpParas.dat"
energy_coefficient = 1.0
force_coefficient = 0.1
grad_tol = 0.1
energy_rmse_tol = 0.0001
force_rmse_tol = 0.01
memory_size = 10
