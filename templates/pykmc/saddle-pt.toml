# pyKMC catalog on the Pt island. The goal is 27 connected saddles under 1.5 eV.
id = "pykmc/saddle-pt"
engine = "pykmc"
problem = "saddle-search/pt-island"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn event search"
tuning = "beland-2015-pt111"
kernel = "morse_shift"
failure_cap = 20000
note = "Published k-ART push on the archive shifted Morse. Béland, Mousseau, and coauthors, Comput. Mater. Sci. (2015), doi:10.1016/j.commatsci.2014.11.047, deform one atom and its surroundings by 0.2–0.5 Å and take one to three perpendicular steps. Lanczos there is about 12–15 force evaluations. The pinned artn-plugin Pt(111) heptamer is examples/LAMMPS.Pt111.d/artn.in: ninit 1, nsmooth 2, nnewchance 2, eigen_step_size 0.25, eigval_thr -0.05, lanczos_disp 1e-4, lanczos_eval_conv_thr 1e-2, push_over 1.0. lammps.in sets dmax 5.0. That example pushes along a file, one known hop, so this catalogue uses push_mode rad and push_dist_thr 3, which reaches the Pt neighbor at r0 2.897. The example forc_thr is 0.01. The harness stop stays 0.001. There is no pre-kick. The central atom is one of atoms 0–6. The climb ceiling is 10000 and each endpoint minimization budget is 2000. failure_cap 20000 is the PAR-2 denominator. A harness success is an index-1 saddle at the force stop whose endpoints pass the eOn r2205 link, distance_difference 0.1 angstrom. The barrier window and the novelty test count unique saddles. They do not reject a connected index-1 saddle. Both endpoint minima are stored beside the result. The runner exits after 160 searches add no new unique saddle under 1.5 eV, once 200 searches have run. The potential is r2549 Morse::force, the shifted Morse of the 2014 Pt archive. morse/smooth/linear is the separate pykmc/saddle-pt-smooth row."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
rcut = 9.5
rnei = 3.0
timeout = 1800

[search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.0
rmsd_connect = 0.5
max_searches = 20000
search_budget = 10000
