# pyKMC KMC on the Pt hTST reactant.
id = "pykmc/htst-pt"
engine = "pykmc"
problem = "hTST/Pt"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn KMC"
tuning = "beland-2015-pt111"
kernel = "morse"
reducer = "htst-cycles"
failure_cap = 50000000
geometry = "website/hTST/Pt/eon-dimer-lbfgs/pos.con"
note = "KMC on the minimized reactant. Temperature 700 K, prefactor 1.2e12, and the barrier and rate cycle targets are archive/entries/hTST/Pt/eon-dimer-lbfgs/report.py: 13 barrier cycles and 224 rate cycles. A reference barrier matches only at three decimals. The push is the published Pt profile in pykmc/saddle-pt. The link test is unchanged. The potential is morse/smooth/linear. The 2014 Pt barriers were measured with shifted Morse. eon-svn hTST Pt uses kernel morse_shift. eon-client hTST Pt uses this smooth-linear kernel."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
barrier_max = 1.5
rmsd_connect = 0.5
rcut = 9.5
rnei = 3.0
timeout = 1800

[kmc]
max_searches = 20000
