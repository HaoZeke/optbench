# pyKMC KMC on the Pt hTST reactant.
id = "pykmc/htst-pt"
engine = "pykmc"
problem = "hTST/Pt"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn KMC"
tuning = "beland-2015-pt111"
kernel = "morse_shift"
reducer = "htst-cycles"
geometry = "website/hTST/Pt/eon-dimer-lbfgs/pos.con"
note = "KMC on the minimized reactant. Temperature 700 K and prefactor 1.2e12 are archive/entries/hTST/Pt/eon-dimer-lbfgs/report.py. The ranked sample is 13 barrier windows. A window closes when every reference barrier, rounded to three decimals, has been seen once. PAR-2 uses convergence.max_force_calls from problems/hTST/Pt.toml, 20000000. Rate windows are reported and do not decide the rank. The push is the published Pt profile in pykmc/saddle-pt. Process identity is the top-window RMSD test plus a 0.05 eV barrier gate. The potential is r2549 shifted Morse, the potential of the 2014 Pt barriers."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
barrier_max = 1.5
rmsd_connect = 0.5
rcut = 9.5
rnei = 3.0
timeout = 1800

[kmc]
max_searches = 250000
