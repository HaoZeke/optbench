# Extra labelled row. The baseline catalogue is pykmc/saddle-pt on shifted Morse.
id = "pykmc/saddle-pt-smooth"
engine = "pykmc"
problem = "saddle-search/pt-island"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn event search"
tuning = "beland-2015-pt111"
kernel = "morse"
failure_cap = 20000
note = "Same published push as pykmc/saddle-pt, on morse/smooth/linear. This is not the 2014 archive potential. The result is ranked false and labelled with that potential. A harness success is an index-1 saddle at the force stop whose endpoints pass the eOn r2205 link. The stored sample is the 561-search catalogue. It was rescored. It was not rerun."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
rcut = 9.5
rnei = 3.0
timeout = 1800

[search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.0
rmsd_connect = 0.5
max_searches = 20000
search_budget = 10000
