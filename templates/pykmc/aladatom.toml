# pyKMC AKMC catalogue on the accelerated-md reactant at 250 K.
id = "pykmc/aladatom"
engine = "pykmc"
problem = "accelerated-md/aladatom"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn AKMC"
tuning = "beland-2015-pt111"
kernel = "eam"
reducer = "amd-catalogue"
failure_cap = 50000000
geometry = "website/accelerated-md/reactant.con"
note = "Three independent AKMC catalogues on the minimized reactant, with the same columns as the eOn AKMC reducer. Seed 1 keeps the original catalogue. Prefactor 1e12 is the eOn template default_value. Temperature 250 K, confidence 0.95, and the 20 kT window are the problem values. The push is the published Pt profile in pykmc/saddle-pt. Process identity is the top-window RMSD test plus a 0.05 eV barrier gate. The kernel is the r2549 Aluminum EAM through the harness. The eOn AKMC row uses the client's built-in eam_al and a client counter. rate_accuracy is zero when the HTST catalogue rate is at least twice the parallel-replica reference."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
barrier_max = 1.5
rmsd_connect = 0.5
rcut = 6.5
rnei = 3.0
timeout = 1800

[kmc]
prefactor = 1.0e12
max_searches = 8000
seeds = 3
