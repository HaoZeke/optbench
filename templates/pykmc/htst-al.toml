# pyKMC KMC on the Al hTST reactant.
id = "pykmc/htst-al"
engine = "pykmc"
problem = "hTST/Al"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn KMC"
tuning = "beland-2015-pt111"
kernel = "eam"
reducer = "htst-cycles"
geometry = "website/hTST/Al/eon-dimer-cg/pos.con"
note = "KMC on the minimized reactant. Temperature 300 K and prefactor 1.2e12 are archive/entries/hTST/Al/eon-dimer-cg/report.py. The ranked sample is 639 barrier windows. A window closes when every reference barrier, rounded to three decimals, has been seen once. The rank is the median sad-fcs of those windows. There is no force-call cap, so PAR-2 stays unset. Rate windows are reported and do not decide the rank. The push is the published Pt profile in pykmc/saddle-pt. Process identity is the top-window RMSD test plus a 0.05 eV barrier gate. The kernel is the r2549 Aluminum EAM. eon-svn and eon-client hTST Al use that same EAM family."

[pykmc]
ninit = 1
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 3.0
eigen_step_size = 0.25
eigval_thr = -0.05
nsmooth = 2
nnewchance = 2
neigen = 1
nperp = 3
lanczos_min_size = 12
lanczos_max_size = 15
lanczos_disp = 1.0e-4
lanczos_eval_conv_thr = 1.0e-2
push_over = 1.0
dmax = 5.0
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 10000
barrier_max = 1.5
rmsd_connect = 0.5
rcut = 6.5
rnei = 3.0
timeout = 1800

[kmc]
max_searches = 400000
