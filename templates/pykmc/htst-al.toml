# pyKMC event search on the Al hTST reactant.
id = "pykmc/htst-al"
engine = "pykmc"
problem = "hTST/Al"
code = "pykmc"
code_version = "0.0.1"
commit = "9fd1f6e9085ef92642142406f3dd74e574209898"
algorithm = "pARTn event search"
tuning = "default"
kernel = "eam"
failure_cap = 2000000
geometry = "website/hTST/Al/eon-dimer-cg/pos.con"
note = "One reactant. The kernel is the r2549 Aluminum EAM force routine. Highest free atoms are tried with the pyKMC push defaults until one connected index-1 saddle under 1.5 eV, or the cap. Connection RMSD uses the free atoms within 1.5 A of the highest free atom. The 2014 eon-dimer-cg barrier_force_calls is a mean over KMC states."

[pykmc]
ninit = 2
push_mode = "rad"
push_step_size = 0.4
push_dist_thr = 1.0
eigen_step_size = 0.2
lanczos_min_size = 10
lanczos_max_size = 20
forc_thr = 0.001
delr_thr = 1.0e9
converge_property = "norm"
evalf_max = 20000
nsearch = 4
centers = 6
barrier_max = 1.5
rmsd_connect = 0.5
rcut = 6.5
timeout = 1800
