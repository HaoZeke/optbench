id = "eon-r2549/saddle-pt-stock"
engine = "eon-client"
problem = "saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
failure_cap = 100000000
tuning = "stock"
pass_limit = 2000
note = """Stock SVN r2549 AKMC on the Pt island. The client is Fortran, unpatched, and prints r2549. QSC is omitted because that potential is not in the revision. Job, temperature, dimer, displacement, and the CG minimizer stay at the code defaults. Optimizer and Saddle Search converged_force are the problem stop, 0.001 eV/Ang. The potential is ext_pot and the harness kernel is morse/smooth/linear. One seed, the pt-island geometry, stop at 27 good saddles at or below 1.5 eV. Nothing here is tuned toward the archived SoftSaddle counts."""

[ini.Main]
job = "akmc"

[ini.Potential]
potential = "ext_pot"

[ini.Optimizer]
converged_force = 0.001

[ini."Saddle Search"]
converged_force = 0.001
