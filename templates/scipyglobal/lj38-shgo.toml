note = "SciPy 1.18.1 shgo with Sobol sampling, the documented high-dimensional construction. n is 128 and iters is 1. SciPy rounds a Sobol n up to a power of two, and 128 is the smallest count above 3N+1 = 115. The local minimizer is SLSQP with the analytic gradient and ftol 1e-12. The call leaves x0 and rng unset. The force-call cap is 2000000. The Delaunay complex is built before the potential is called. n=64 does not triangulate: shgo returns nfev 0 in 0.02 s. A 116-point Sobol prefix is rejected by Qhull QH6239 in 0.05 s at 100828 KB, and Sobol will not request that length. The 128-point complex does not fit. shgo at a 6 GiB address cap raised QH6080 after 328 s (2046761 regions, 119 of 128 points processed, 2072358 facets). The same call at a 10 GiB cap raised QH6080 after 379 s (4176096 regions, 119 points processed, 4201693 facets). The worker address space is limited to 10 GiB, and that Qhull failure is recorded as a crash."

