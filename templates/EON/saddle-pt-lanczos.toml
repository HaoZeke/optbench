id = "EON/saddle-pt-lanczos"
engine = "eon-client"
problem = "saddle-search/pt-island"
code = "EON"
code_version = "(SVN r2549)"
commit = "r2549"
algorithm = "Lanczos"
reducer = "harness"
failure_cap = 100000000
tuning = "default"
kind = "akmc"
kernel = "morse"
note = """Stock AKMC Lanczos on the Pt island. The binary is SVN r2549, Fortran, unpatched. The goal is the archive stop: 27 good saddles below 1.5 eV, force norm 0.001 eV/Angstrom. Ten repetitions, seeds 1000 through 1009. Displacement, thermostat, prefactor, and L-BFGS are the r2549 stock keys: atoms 0-6, radius 3.3, magnitude 0.1, Lanczos tolerance 0.001, max_iterations 20, quit_early true. pass_limit 250 is the stock cutoff on this problem. A repetition that misses 27 stays in the sample as a cap failure. The harness potential is the problem Morse, morse/smooth/linear, cutoff 9.5, periodic in x and y. Nothing here is tuned toward the archived force calls, unique saddles, or connected fraction. A gap against adaptive_HSphere-lbfgs-lanczos-sm0 is a finding."""

pass_limit = 250
seeds = [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
starts = ["pt-island"]

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Lanczos]
tolerance = 0.001
max_iterations = 20
quit_early = true
