id = "EON/saddle-pt-lanczos"
engine = "EON"
problem = "saddle-search/pt-island"
code = "EON"
code_version = "(SVN r2549)"
commit = "r2549"
algorithm = "adaptive hypersphere LBFGS Lanczos"
reducer = "harness"
failure_cap = 5064
tuning = "default"
kind = "akmc"
kernel = "morse"
note = """
AKMC on the Pt island with EON SVN r2549, Fortran, no source patch. problems/saddle-search/pt-island.toml [goal] sets connected_saddles = 27 and barrier_below_eV = 1.5. [convergence] sets norm, force_norm, and force_unit, and has no max_force_calls. The problem file has no max_searches. [scoring.v2] cost is one displacement search, and its note stores a climb budget of 1000, 64 calls of overshoot, and two endpoint budgets of 2000. failure_cap 5064 is that per-search sum. It is not a repetition force-call cap. templates/softsaddle/saddle-lanczos-sm0.toml max_searches = 5000 and templates/eon/develop-saddle-pt-lanczos.toml failure_cap = 100000000 are template keys, not problem keys. No campaign score is published from a repetition that stops at 5064.
Search keys that this binary reads are taken from softsaddle/upstream/test_run/paper-result-reproduce/adaptive_HSphere-lbfgs-lanczos-sm0/iniConfig.m. opt_method lbfgs and lbfgs_memory 60 are min_method LBFGS and memory_size 60, and r2549 reads lbfgs_memory in [Optimizer]. finite_difference 1e-4 is finite_diff_step and lanc_finite. max_move 0.5 and max_step_size 0.5 are delta and max_step_size. converged_force 0.001 is cg_err and the problem force norm. max_iterations 1000 is cg_iter_max. Lanczos max_iterations 8 and tolerance 0.01 are lanc_iter and lanc_abs_tol. displace_magnitude 0.1 is hyper_rad0. displace_radius 3.3 is displace_radius. displace_atom_list 0-6 is a_to_disp 7. disp_by_hypersphere_method, self_learning_hyper_rad, automatic_self_learning, self_learning_scheme, mix_prev_hyper_rad, sort_displacements, save_lanczos_call, and save_lanczos_factor are not keys in the r2549 ini. save_lanczos_factor 0 in that file means the mode is computed on every step. The kernel is morse/smooth/linear. Seeds are 1000 through 1009.
"""
seeds = [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
starts = ["pt-island"]
pass_limit = 100000
workers = 1

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 1.0e-4
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.5
max_iterations = 1000
lbfgs_memory = 60

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 1
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_step_size = 0.5
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Lanczos]
tolerance = 0.01
max_iterations = 8
quit_early = true
