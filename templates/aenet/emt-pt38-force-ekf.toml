note = "Behler-Parrinello squared-error loss on the problem trajectory. Fingerprints come from the archived fpParas.dat. The network has hidden layers 10 and 7, tanh, and a linear output, with NoScaler. Each start is uniform[-1, 1) from PCG64(20261015 + index). One harness call is one full-dataset loss and gradient. The stop is the L2 norm of each parameter-tensor gradient. pyamff 8037eb98 used the max absolute entry. The extended Kalman filter uses lambda 0.999, lambda0 0.97, state 10, pnoise 0, and wgroup 100. The covariance starts at 0.1 on the diagonal and 0 off the diagonal. One call walks every structure, and every force residual when the force coefficient is positive. The energy coefficient is 1 and the force coefficient is 0.1. The stop is 0.1 and the cap is 30000."

