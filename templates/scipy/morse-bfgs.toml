id = "scipy/morse-bfgs"
engine = "scipy"
problem = "minimization/morse-bulk"
code = "SciPy"
code_version = "1.18.1"
commit = "e4e854eaa8f18d807cd3496028e257e36caa93cc"
algorithm = "BFGS"
tuning = "default"
note = "Default row. fun and jac are the harness kernel. A repeated coordinate returns the cached energy and forces and does not add a call. Morse bulk has no per-atom cap. The cell is periodic. The SciPy infinity-norm gtol is the problem force norm divided by sqrt(n), so a library stop is inside the Euclidean stop. The callback stops when the Euclidean norm meets the problem value. The iteration ceiling sits above the force-call cap. The harness counter is the budget."

[scipy]
method = "BFGS"

[ini.Optimizer]
converged_force = 0.001
max_iterations = 10000
