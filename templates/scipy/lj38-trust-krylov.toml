id = "scipy/lj38-trust-krylov"
engine = "scipy"
problem = "minimization/lj38"
code = "SciPy"
code_version = "1.18.1"
commit = "e4e854eaa8f18d807cd3496028e257e36caa93cc"
algorithm = "trust-krylov"
tuning = "default"
note = "Default row. fun and jac are the harness kernel. A repeated coordinate returns the cached energy and forces and does not add a call. Hessian-vector products are the analytic Hessian of this potential and are not force calls. The per-atom cap is 0.2, the same length as the eOn max move. A trial past that cap is refused before the potential runs. The trust-region gtol is the Euclidean problem force norm. The trust radius cannot exceed 0.2 times sqrt(atoms). The iteration ceiling sits above the force-call cap. The harness counter is the budget."

[scipy]
method = "trust-krylov"
maxstep = 0.2

[ini.Optimizer]
converged_force = 0.01
max_iterations = 10000
