id = "scipy/lj38-cg"
engine = "scipy"
problem = "minimization/lj38"
code = "SciPy"
code_version = "1.18.1"
commit = "e4e854eaa8f18d807cd3496028e257e36caa93cc"
algorithm = "CG"
tuning = "default"
note = "Default row. fun and jac are the harness kernel. A repeated coordinate returns the cached energy and forces and does not add a call. The per-atom cap is 0.2, the same length as the eOn max move. A larger trial is mapped back inside that ball before the potential runs. The map is the identity through 0.18 and smooth beyond it. The SciPy infinity-norm gtol is the problem force norm divided by sqrt(n), so a library stop is inside the Euclidean stop. The callback stops when the Euclidean norm meets the problem value. The iteration ceiling sits above the force-call cap. The harness counter is the budget."

[scipy]
method = "CG"
maxstep = 0.2

[ini.Optimizer]
converged_force = 0.01
max_iterations = 10000
