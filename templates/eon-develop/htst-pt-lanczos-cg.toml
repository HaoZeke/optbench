id = "eon-develop/htst-pt-lanczos-cg"
engine = "eon"
problem = "hTST/Pt"
code = "eOn (develop a7aa574)"
code_version = "a7aa574"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Lanczos-CG rotation: max=10, tol=0.05"
reducer = "harness-htst"
pass_limit = 8000
note = "Stock eOn develop a7aa574 on the same Pt island, starts, and stop as the archived Lanczos-CG row. This tree is https://github.com/TheochemUI/eon, not the SVN code. The ini matches that archive: temperature 700 K, seed 42, morse_pt, prefactor 1.2e12, confidence 1.9, minimize_first, least-coordinated displacement weight 1, radius 3.3, magnitude 0.3, Lanczos tolerance 0.05 and max_iterations 10, optimizer converged_force 0.001 and max_iterations 5000, saddle max_energy 1000. convergence_metric max_atom and the saddle converged_force 0.001 are the 2013 min-mode stop. finite_difference, quit_early, thermally_accessible_window, confidence_scheme, and opt_method stay at the develop defaults. A start is one barrier window from optbench.htst. Communicator num_jobs 32."

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
convergence_metric = "max_atom"
converged_force = 0.001
max_iterations = 5000

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_least_coordinated_weight = 1.0
displace_radius = 3.3
displace_magnitude = 0.3
max_energy = 1000.0
max_iterations = 5000
converged_force = 0.001

[ini.Prefactor]
default_value = 1.2e12

[ini.Lanczos]
tolerance = 0.05
max_iterations = 10
