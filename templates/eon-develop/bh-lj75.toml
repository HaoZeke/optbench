id = "eon-develop/bh-lj75"
engine = "eon"
problem = "globalopt/lj75"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "Basin hopping"
reducer = "harness"
failure_cap = 1000000
kind = "basin"
kernel = "lj40"
cambridge = true
cache_token = "cambridge-1"
tuning = "lj38"
asv_class = "EonDevelopBhLj75"
note = """
Basin hopping with the eOn LJ38 settings. Temperature 8000, random_seed 314159, displacement 0.5, adjust_displacement true, target_ratio 0.3, steps 10000000, LBFGS converged_force 0.001, max_move 0.2, max_iterations 1000, lbfgs_memory 20. r2549 BasinHoppingJob.cpp accepts an uphill step with exp(-deltaE/(temperature*8.6173324e-5)); 8000 K is kT 0.689386592. develop ParametersOptions.h uses the same kB. The eOn basin-hopping page (https://henkelmanlab.org/eon/basin_hopping.html) cites Wales and Doye, J. Phys. Chem. A 101, 5111 (1997), and does not scale temperature or displacement with the number of atoms: displacement stays 0.5 and adjust_displacement tracks target_ratio. That page's target_ratio default is 0.5. This row keeps the LJ38 value 0.3. The pinned clients default the displacement distribution to uniform (r2549 Parameters.cpp, develop basin_hopping_options_t); the ini leaves it unset. significant_structure stays at its default true, the minimized geometry of White and Mayne, Chem. Phys. Lett. 289, 463 (1998), which that page cites. jump_steps stays 0, so jump_max does not move atoms. stop_energy is the Cambridge minimum plus 0.001. Success is the harness Cambridge rule: a finite energy at or below that threshold and harness calls under the problem cap. There is no wall-clock budget.
"""
seeds = [314159]
asv_full = false
asv_timeout = 7200

[input]
archive_path = "website/globalopt/lj75/lj75_clusters.tgz"
select = "coords"

[ini.Main]
job = "basin_hopping"
temperature = 8000
random_seed = 314159
finite_difference = 0.001

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Basin Hopping"]
steps = 10000000
displacement = 0.5
adjust_displacement = true
target_ratio = 0.3
stop_energy = "-397.491331"
