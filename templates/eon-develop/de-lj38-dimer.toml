eOn at develop a7aa57472fb7d823953fd36b78cd755fa4842d30. Fortran linked and untuned. This is not EON, the SVN code. Min-mode dimer from the interpolated end points of the 50 LJ38 pairs. The ini is the archive config and nothing else: L-BFGS, converged_force 0.001, max_iterations 1000, dimer converged_angle 5, rotations_max 10, max_energy 1e9. Unset keys stay at the develop defaults. The archived force_calls 337 is the paper row. This stock run scores force_calls 503 (min 98, median 362, max 2360, nfailed 13). The gap is a finding and was not tuned closed.
'''
