id = "eon-develop/ts-lj38-lanczos-improved"
engine = "eon"
problem = "tsopt/LJ38"
code = "eOn (develop a7aa57472fb7d823953fd36b78cd755fa4842d30)"
code_version = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Lanczos improved L-BFGS"
reducer = "harness"
failure_cap = 10000
kind = "ts-lj38"
kernel = "lj40"
asv_class = "EonDevelopTsLj38LanczosImproved"
note = '''
eOn at current develop a7aa57472fb7d823953fd36b78cd755fa4842d30. This is the git client (https://github.com/TheochemUI/eon, https://eondocs.org), not the SVN code. Same archived problem, 200 starts, and convergence criterion as EON (SVN r2549): Lanczos tolerance 0.01, max_iterations 50, quit_early true, saddle max_energy 1000, LBFGS max_move 0.1, max_iterations 3000, converged_force 0.001. direction.dat is archive random_mode.py. The harness kernel is unshifted lj/cut cutoff 40. Stock and untuned.
'''
direction = "numpy"
seeds = [1]
asv_timeout = 900
budget_seconds = 600

[ini.Main]
job = "saddle_search"
finite_difference = 0.001

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_move = 0.1
max_iterations = 3000

[ini."Saddle Search"]
min_mode_method = "lanczos"
max_energy = 1000

[ini.Lanczos]
tolerance = 0.01
max_iterations = 50
quit_early = true
