id = "eon-develop/htst-al-dimer-cg-stock"
engine = "eon"
problem = "hTST/Al"
task = "htst"
reducer = "harness"
client_family = "develop"
code = "eOn"
code_version = "(develop a7aa57472fb7)"
commit = "a7aa57472fb7d823953fd36b78cd755fa4842d30"
algorithm = "Dimer-CG rotation: max=50 tol=1"
tuning = "default"
failure_cap = 100000000
pass_limit = 64
rate_template = "eon-develop/htst-al-dimer-cg-stock-rate"
rate_stem = "eon-develop-htst-al-dimer-cg-stock-rate"
geometry = "website/hTST/Al/eon-dimer-cg/pos.con"
note = "Stock dimer CG on the Al reactant. The dimer block is the published algorithm, CG with 50 rotations and angle 1. Confidence, displacement, prefactor, and the optimizer iteration limit stay at the develop constructor. The kernel is the same Fortran Aluminum EAM through ext_pot. The client is eOn develop a7aa57472fb7, a different code from EON r2549. Stock confidence does not stop a reactant that has not collected the reference processes, so the run is 64 AKMC passes unless both window targets close first. That bound is the observation, not an optimizer parameter."

[ini.Main]
job = "akmc"
temperature = 300
random_seed = 42

[ini."Saddle Search"]
min_mode_method = "dimer"

[ini.Dimer]
rotations_max = 50
converged_angle = 1
opt_method = "cg"
