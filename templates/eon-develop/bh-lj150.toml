Basin hopping toward the LJ150 minimum. Temperature 8000, random_seed 314159, displacement 0.5, adjust_displacement true, target_ratio 0.3, steps 10000000, stop_energy -893.309258. The knobs are the LJ38 basin-hopping ini. The stop is the Cambridge N=150 minimum -893.310258 plus 0.001. The client writes termination_reason 0 when the step loop ends, including when the energy is still above the stop. Success is minimum_energy below the stop and harness calls under 2000000. The binary is develop 80e94f88, version string 3.6.0 (80e94f88), which contains b0bd4d5a. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40. Starts are coords.1 through coords.100. The per-start wall budget is 172800 s so a start can reach that call cap.
'''
