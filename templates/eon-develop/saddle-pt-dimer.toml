id = "eon-develop/saddle-pt-dimer"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn (develop 500350d9)"
code_version = "500350d9"
commit = "500350d9fae881f06c7ef194e5868da079c4be5a"
algorithm = "Dimer"
reducer = "akmc-until-27"
tuning = "default"
note = """
The archived eon-dimer config.ini, on TheochemUI/eon commit 500350d9 of branch fix/develop-regressions-vs-350. potential morse_pt is the client Morse potential. The ini does not set Dimer improved or Dimer opt_method. The client default for an omitted improved key is true, and ParametersINI.cpp reads an omitted Dimer opt_method as cg. rotations_max is 20. The stop is done.py: 27 good saddles with barrier strictly below 1.5 eV. There is no pass limit and no wall-clock budget. The server builds each displacement. Seeds are 1000 through 1009.
"""

[ini.Main]
job = "akmc"
temperature = 700

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 8
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_all_listed = false
displace_radius = 3.3
displace_atom_list = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000

[ini.Dimer]
rotations_max = 20
converged_angle = 5.0

[ini.Prefactor]
default_value = 5e12
