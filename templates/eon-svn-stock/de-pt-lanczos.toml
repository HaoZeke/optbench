id = "eon-svn-stock/de-pt-lanczos"
engine = "eon"
problem = "double-ended-saddle-search/pt-island"
code = "EON (SVN r2549)"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos"
reducer = "harness"
failure_cap = 3000
kind = "de-pt-mode"
kernel = "morse"
tuning = "stock"
note = '''
Stock unpatched EON SVN r2549, Fortran linked, on the archive Pt-island Lanczos problem. The ini is the 2014 file: L-BFGS converged_force 0.001, max_iterations 1000, Lanczos max_iterations 10, tolerance 0.05, quit_early true, max_energy 1e9. Unset keys stay at the r2549 defaults, including finite_difference 0.01 and client_displace_type load. The harness counts morse/smooth/linear evaluations (D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, periodic in x and y) and sets random_seed 1. This is not a tune toward the archive mean.
'''
seeds = [1]

[ini.Main]
job = "saddle_search"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 1000

[ini."Saddle Search"]
max_iterations = 1000
min_mode_method = "lanczos"
max_energy = 1000000000.0

[ini.Lanczos]
max_iterations = 10
tolerance = 0.05
quit_early = true
