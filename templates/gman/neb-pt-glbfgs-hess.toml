# Gman r235 global L-BFGS, Hessian step, library defaults, archive force stop.
id = "gman/neb-pt-glbfgs-hess"
engine = "gman"
problem = "neb/Pt-heptamer"
code = "Gman"
code_version = "r235"
commit = "r235"
algorithm = "glbfgs-hess"
counter = "harness"
tuning = "default"
failure_cap = 10000
note = "Gman r235 is the latest release. glbfgs.init is called with min=hess only. maxmove 0.2, dR 1e-4, memory 25, and alpha 0.05 are the library defaults. neb.relax keeps library spring 5, tangent new, climbing image off, and Fmag. fmax 0.01 and the 10000-call cap are the archive convergence criterion. The integer is pot.count() divided by 8, then %d. No parameter was set to move the score toward the archive."

[stop]
force_norm = 0.01
max_force_calls = 10000

[gman]
optimizer = "glbfgs"
minimizer = "hess"
potential = "morse"
