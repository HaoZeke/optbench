id = "gman/neb-pt-glbfgs-line"
engine = "gman"
problem = "neb/Pt-heptamer"
code = "Gman"
code_version = "r235"
commit = "299795f6dc4410b49d3db3006ffea0bbb8613c2ab44126be2937ae7b34842849"
algorithm = "lbfgs"
reducer = "harness"
failure_cap = 10000
paper_baseline = true
parameter_source = "archive"
tuning = "archive"
note = '''
Archived opt.py builds Gopt.glbfgs with maxmove 0.2, min line, alpha 0.05, and memory 25, then relaxes a climbing-image NEB: 8 images, spring 5, tangent new, fmax 0.01, converge Fmag, fsaddle off, method ci, itrmax 100000. The Morse force is the r235 Fortran routine (U0 0.7102, alpha 1.6047, r0 2.897, rc 9.5). force_calls in the dat file is the truncated mean of pot.count()/8 over the 13 paths, which is the integer the 2013 script writes. Each start stores that per-image quotient and the band total. The archived script writes algorithm lbfgs for every Gman optimizer; the optimizer that runs is GL-BFGS with a line search.
'''

[stop]
force_norm = 0.01

[gman]
optimizer = "glbfgs"
min = "line"
alpha = 0.05
memory = 25
maxmove = 0.2
images = 8
spring = 5.0
tangent = "new"
itrmax = 100000
ppd = 1
fmax = 0.01
fsaddle = "off"
method = "ci"
converge = "Fmag"
potential = "morse"
