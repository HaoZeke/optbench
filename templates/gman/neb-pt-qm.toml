# Gman 1.0.0.01 stock QuickMin on the Pt-heptamer band.
id = "gman/neb-pt-qm"
engine = "gman"
problem = "neb/Pt-heptamer"
code = "Gman"
code_version = "1.0.0.01"
commit = "r235"
algorithm = "qm"
failure_cap = 10000
tuning = "default"
note = "Gman 1.0.0.01 is the version file in the r235 release. QuickMin is qm.init() with no arguments, so maxmove is 0.2 and dt is 0.15. The band is the archive problem: 8 interior images, spring 5, improved tangent, climbing image, fmax 0.01, iteration cap 10000. pot.count is the band total. The archive published that total divided by 8."

[stop]
force_norm = 0.01

[gman]
optimizer = "qm"
images = 8
spring = 5.0
tangent = "new"
itrmax = 10000
ppd = 1
fmax = 0.01
fsaddle = "off"
method = "ci"
converge = "Fmag"
potential = "morse"
