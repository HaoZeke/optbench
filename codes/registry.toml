note = "2.11.0. Each algorithm has its own licence in COPYING. The minimization row is LD_TNEWTON. maxeval is the force-call cap, and the objective calls force_stop at the Euclidean stop. On minimization/lj38, 951 of 1000 starts reach an index-0 stop and 350 of those stops have energy near zero, so that row is not ranked. Morse bulk is ranked: 93 of 100 starts meet the force stop inside the bulk well. LD_LBFGS, LD_VAR1, and LD_SLSQP leave the first LJ38 start in two evaluations and are not ranked. GN_CRS2_LM, GN_ISRES, GN_DIRECT, GD_STOGO, and GN_MLSL run on the harness gradient inside the 100 angstrom cell. A 40-evaluation probe of the first LJ38 start leaves their best energy near zero, and a million-evaluation start is about 25 minutes, so those algorithms have no campaign row."

