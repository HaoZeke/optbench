# Codes that can write a new OptBench score.
# The benchmark contributor is the person who runs the entry.
# A score is added only after that run writes benchmark.dat.

benchmark_contributor = "Rohit Goswami"

[[code]]
id = "eon"
name = "eOn"
role = "minimization and saddle search"
repository = "https://github.com/TheochemUI/eon"
ref = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
committed = "2026-10-02"
note = "Version string 3.5.0 and Python client 0.4.2. Lennard-Jones scores use this client. The subset counter check uses the conda-forge binary, which prints 3.5.0 (7ec1840). That check is not a published mean."

[[code]]
id = "eon-main"
name = "eOn"
role = "minimization and saddle search"
repository = "https://github.com/TheochemUI/eon"
ref = "main"
commit = "1d71c944501832bfafb955ffe13b9aae50c8efd4"
committed = "2026-10-15"
note = "Current main, including merged pull request 776. The version string is 3.6.0. Templates under templates/eon/ use this commit. The 3.5.0 pin above stays for the scores that were run on it."

[[code]]
id = "eon-develop"
name = "eOn"
role = "minimization and saddle search"
repository = "https://github.com/TheochemUI/eon"
ref = "develop"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
committed = "2026-10-16"
note = "develop HEAD built from source. The version string is 3.6.0 (7095b23a). GPR-dimer is absent: TheochemUI/gpr_optim is private and eonclient reports GPRD disabled. This pin is not the conda-forge 3.5.0 binary."

[[code]]
id = "rgmin"
name = "rgmin"
role = "minimization"
repository = "https://github.com/OmniPotentRPC/rgmin"
ref = "fix/default-cap-per-method"
commit = "f15726f1c7983b3656c5dbc2f812e2394e144500"
committed = "2026-10-17"
note = "Minimizers, version 0.4.1, branch fix/default-cap-per-method. A Lennard-Jones 38 entry uses the harness force counter. L-BFGS memory defaults to 10. BFGS, dogleg, and FIRE 2.0 start without the 0.2 per-atom cap. The other Cartesian methods start at 0.2. An explicit cap still applies. SR1 and SR2 step in a trust region sized to that cap. DIIS searches the GDIIS image. Adam scales its direction to unit per-atom length."

[[code]]
id = "rgsaddle"
name = "rgsaddle"
role = "saddle search"
repository = "https://github.com/OmniPotentRPC/rgsaddle"
ref = "main"
commit = "c0db2b8d333c557251635cb8bb7b3d81f0088a71"
committed = "2026-10-15"
note = "0.2.2 at main c0db2b8d. Band and min-mode sessions on this main. Stencil.band presets are not built here; the campaign calls the C band and min-mode API. OCI-NEB is CI-NEB followed by a min-mode refinement. Dimer, Lanczos, and P-RFO scores use this commit. Nonlinear CG is refused by check_force_driven; the min-mode translators are L-BFGS and FIRE."

[[code]]
id = "ase"
name = "ASE"
role = "minimization and saddle search"
repository = "https://gitlab.com/ase/ase"
ref = "3.29.0"
commit = "f27c0005ae6a67ea419f996e728668865bfc1f86"
committed = "2026-10-15"
note = "Atomic Simulation Environment 3.29.0. BFGS, LBFGS, FIRE, BFGSLineSearch, GPMin, PreconLBFGS, PreconFIRE, and PreconODE12r, plus NEB and dimer. Force calls are harness calculator evaluations."

[[code]]
id = "sella"
name = "Sella"
role = "minimization and saddle search"
repository = "https://github.com/zadorlab/sella"
ref = "2.6.0"
commit = "6cfb60cdb100a146c3c6f0587d5308b247aa8010"
committed = "2026-10-15"
note = "Sella 2.6.0. Order 1 is a saddle and order 0 is a minimum. The Sella 0.1.1 rows on the 2014 tables are legacy and are not this pin. Force calls are harness calculator evaluations."

[[code]]
id = "artn"
name = "pARTn"
role = "saddle search"
repository = "https://gitlab.com/mammasmias/artn-plugin"
ref = "DEVEL"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
committed = "2026-10-05"
note = "Activation-relaxation technique nouveau, plugin branch DEVEL. The benchmark contributor of a new entry is Rohit Goswami."

[[code]]
id = "pygsm"
name = "pyGSM"
role = "saddle search"
repository = "https://github.com/ZimmermanGroup/pyGSM"
ref = "master"
commit = "1b4d5a5557a61adc6a3df7405d6b7255b1fa4865"
committed = "2026-08-13"
note = "Double-ended growing string, master 1b4d5a55. No release tag. The import version is 1.0.0+692.g1b4d5a5.dirty because versioningit rewrites _version.py at build time. The level of theory is the harness kernel. Endpoints stay the archived pair. The coordinate system is delocalized distances for contacts inside 1.35 plus translation and rotation. nnodes is the interior image count plus the two ends. DMAX is the problem max_move. Numpy 2 shims for wilsonB, np.sum, and np.dot live in the runner."

