# GP-dimer parameters for two moving H atoms on a fixed Cu substrate.
cellDimensions = [15.3456, 0.0, 0.0, 0.0, 21.702, 0.0, 0.0, 0.0, 100.0]

[runSelector]
iDist = 0
iRun = 0
sepDists = [0.02, 0.3, 1.0, 3.0]

[problem]
actdistFro = 5.0
dimerSep = 0.01
methodRot = "lbfgs"
methodTrans = "lbfgs"
# Maximum Cartesian force component in eV/Angstrom.
finalConvergenceForce = 0.01
divisorTdimerGP = 10
midpointMaxDisp = 0.5
ratioAtLimit = 0.666666666667
convergenceForceNorm = "linfNorm"

[problem.paramTrans]
stepLength = 0.1
maxStepLength = 0.05
rotremThresh = 50000.0

[problem.initialRotations]
maxIterations = 6
useGpr = true
convergenceAngle = 0.0873

[problem.relaxation]
maxOuterIterations = 500
maxInnerIterations = 200
maxRotationIterations = 10
num_bigiter_initloc = 0
num_bigiter_initparam = 1
assumeManyIterations = true
useGprForInitialTranslation = true

[problem.relaxation.convergence]
force = 0.001
angle = 0.1

[gpr]
gpSigma2 = 1.0e-5
jitterSigma2 = 0.0
noiseSigma2 = 1.0e-7

[gpr.prior]
mu = 0.0
nu = 28.0
s2 = 1.0

[optimizer]
algorithm = "scg"
checkDerivative = false
maxIter = 0
tolFunc = 0.01
tolSol = 0.01

[optimizer.scg]
lambdaLimit = 1.0e16
lambda = 100.0

[early_stopping]
dist_metric = "emd"
threshold = 0.1
use_adaptive_threshold = false
adaptive_A = 1.3
adaptive_floor = 0.25
t_min = 0.15
delta_explore = 0.35
half_life = 50

[pruning]
usePrune = false
pruneBegin = 10
pruneNVals = 4
pruneThreshold = 0.5

[debug]
reportLevel = 2
debugLevel = 0
debugOutDir = "output"
debugPosFile = "position"
debugEnergyFile = "energy"
debugGradFile = "gradient"
debugOutExt = "dat"
debugOffsetMidPoint = 3.0
debugDy = 0.1
debugDz = 0.1
