[project]
name = "optbench"
version = "0.0.0"
description = "Replay the OptBench geometry and saddle suites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cyclopts>=3.24", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
optbench = "optbench.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "asv==0.6.6", "asv-runner==0.3.1"]
campaign = [
    "ase==3.29.0",
    "sella==2.6.0",
    "numpy",
    "scipy",
    "geometric @ git+https://github.com/leeping/geomeTRIC.git@f657e69bae9c81bf7a23e7375db98502ca5c8c30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
